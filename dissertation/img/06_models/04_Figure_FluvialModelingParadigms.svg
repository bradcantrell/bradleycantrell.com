<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2550 1650" width="2550" height="1650">
  <!-- Background -->
  <rect width="2550" height="1650" fill="#d5d4ca"/>

  <!-- Title -->
  <text x="1275" y="100" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" fill="#2a2a2a" letter-spacing="1">Fluvial Modeling Paradigms</text>
  <text x="1275" y="145" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="300" fill="#5a5a5a" font-style="italic">From physical surrogacy to computational simulation to adaptive epistemology</text>

  <!-- Main timeline axis -->
  <line x1="200" y1="750" x2="2350" y2="750" stroke="#3a3a38" stroke-width="3"/>
  <!-- Arrow at end -->
  <polygon points="2360,750 2345,742 2345,758" fill="#3a3a38"/>

  <!-- ============ PHASE BANDS (colored zones behind timeline) ============ -->
  
  <!-- Phase 1: Physical Surrogacy (1870s-1960s) -->
  <rect x="200" y="520" width="520" height="460" rx="6" fill="#b5a898" opacity="0.25"/>
  <text x="460" y="560" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#5a4a3a" letter-spacing="2">PHYSICAL SURROGACY</text>

  <!-- Phase 2: Quantitative Revolution (1960s-1980s) -->
  <rect x="720" y="520" width="420" height="460" rx="6" fill="#a8a898" opacity="0.25"/>
  <text x="930" y="560" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#4a4a3a" letter-spacing="2">QUANTITATIVE REVOLUTION</text>

  <!-- Phase 3: Numerical Modeling (1980s-2000s) -->
  <rect x="1140" y="520" width="420" height="460" rx="6" fill="#98a8a8" opacity="0.25"/>
  <text x="1350" y="560" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#3a4a4a" letter-spacing="2">NUMERICAL MODELING</text>

  <!-- Phase 4: Computational Simulation (2000s-2010s) -->
  <rect x="1560" y="520" width="400" height="460" rx="6" fill="#8898a8" opacity="0.25"/>
  <text x="1760" y="560" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#3a3a4a" letter-spacing="2">COMPUTATIONAL SIMULATION</text>

  <!-- Phase 5: Adaptive / Hybrid (2010s-present) -->
  <rect x="1960" y="520" width="390" height="460" rx="6" fill="#7888a0" opacity="0.25"/>
  <text x="2155" y="560" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a3a4a" letter-spacing="2">ADAPTIVE / HYBRID</text>

  <!-- ============ DATE MARKERS ON TIMELINE ============ -->

  <!-- 1870s -->
  <circle cx="280" cy="750" r="8" fill="#5a4a3a"/>
  <text x="280" y="730" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">1870s</text>
  <text x="280" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Early physical</text>
  <text x="280" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">hazard models</text>
  <text x="280" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">European hydraulic labs</text>

  <!-- 1943 — MRBM -->
  <circle cx="560" cy="750" r="10" fill="#5a4a3a"/>
  <text x="560" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">1943</text>
  <text x="560" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Mississippi River</text>
  <text x="560" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Basin Model</text>
  <text x="560" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">USACE, Vicksburg</text>

  <!-- 1964 — Leopold & Wolman -->
  <circle cx="800" cy="750" r="8" fill="#4a4a3a"/>
  <text x="800" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">1964</text>
  <text x="800" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Fluvial Processes</text>
  <text x="800" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">in Geomorphology</text>
  <text x="800" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Leopold, Wolman &amp; Miller</text>

  <!-- 1976 — Holling / Adaptive Management -->
  <circle cx="1020" cy="750" r="8" fill="#4a4a3a"/>
  <text x="1020" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">1976</text>
  <text x="1020" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Adaptive</text>
  <text x="1020" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Management</text>
  <text x="1020" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Holling; Walters</text>

  <!-- 1984 — HEC-RAS origins -->
  <circle cx="1220" cy="750" r="8" fill="#3a4a4a"/>
  <text x="1220" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">1984</text>
  <text x="1220" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">HEC-RAS</text>
  <text x="1220" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Hydrologic Engineering</text>
  <text x="1220" y="863" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Center</text>

  <!-- 1993 — Delft3D -->
  <circle cx="1400" cy="750" r="8" fill="#3a4a4a"/>
  <text x="1400" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">1993</text>
  <text x="1400" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Delft3D</text>
  <text x="1400" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Deltares, Netherlands</text>

  <!-- 2008 — Stationarity is Dead -->
  <circle cx="1620" cy="750" r="8" fill="#3a3a4a"/>
  <text x="1620" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">2008</text>
  <text x="1620" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">"Stationarity</text>
  <text x="1620" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">is Dead"</text>
  <text x="1620" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Milly et al.</text>

  <!-- 2010s — High-res GIS + CFD -->
  <circle cx="1820" cy="750" r="8" fill="#3a3a4a"/>
  <text x="1820" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">2010s</text>
  <text x="1820" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">High-resolution</text>
  <text x="1820" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">GIS + CFD</text>
  <text x="1820" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">USGS, NOAA, universities</text>

  <!-- 2020s — Composite / Adaptive Modeling -->
  <circle cx="2100" cy="750" r="10" fill="#2a3a4a"/>
  <text x="2100" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38">2020s</text>
  <text x="2100" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Composite modeling</text>
  <text x="2100" y="820" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4a48">Physical + Digital</text>
  <text x="2100" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#6a6a68" font-style="italic">Landscape as model (1:1)</text>

  <!-- ============ INSTITUTIONAL THREAD (below main timeline) ============ -->

  <text x="200" y="920" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#5a5a58" letter-spacing="2">INSTITUTIONS</text>

  <!-- USACE bar -->
  <rect x="380" y="940" width="900" height="28" rx="4" fill="#8a7a6a" opacity="0.35"/>
  <text x="830" y="960" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#3a3020">U.S. Army Corps of Engineers / Waterways Experiment Station</text>

  <!-- Deltares bar -->
  <rect x="1300" y="940" width="400" height="28" rx="4" fill="#6a7a8a" opacity="0.35"/>
  <text x="1500" y="960" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#2a3a4a">Deltares / WL Delft Hydraulics</text>

  <!-- USGS / NOAA bar -->
  <rect x="1100" y="980" width="800" height="28" rx="4" fill="#7a8a7a" opacity="0.35"/>
  <text x="1500" y="1000" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#2a3a2a">USGS / NOAA / Hydrologic Engineering Center</text>

  <!-- University research bar -->
  <rect x="700" y="1020" width="1650" height="28" rx="4" fill="#8a8a9a" opacity="0.3"/>
  <text x="1525" y="1040" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#2a2a3a">University research (MIT, Imperial, Delft, LSU, Harvard GSD, UVA)</text>

  <!-- ============ KEY EPISTEMOLOGICAL SHIFT annotation ============ -->
  
  <!-- Dashed line marking the shift from predict-and-control to adaptive -->
  <line x1="1520" y1="580" x2="1520" y2="1060" stroke="#4a4a48" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="1530" y="605" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4a48" font-style="italic">← epistemological shift</text>

  <!-- Figure label -->
  <text x="150" y="1600" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#7a7a70">Fig 04-D1 — Cantrell 2026</text>
</svg>
