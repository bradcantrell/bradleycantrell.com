<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2550 1650" width="2550" height="1650">
  <rect width="2550" height="1650" fill="#d5d4ca"/>

  <!-- Title -->
  <text x="1275" y="100" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" fill="#2a2a2a" letter-spacing="1">Temporal Mismatch</text>
  <text x="1275" y="142" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="300" fill="#5a5a5a" font-style="italic">Observation technologies vs. ecological timescales</text>

  <!-- Axes -->
  <!-- X axis: Deployment Duration -->
  <line x1="300" y1="1300" x2="2350" y2="1300" stroke="#3a3a38" stroke-width="2"/>
  <polygon points="2360,1300 2348,1293 2348,1307" fill="#3a3a38"/>
  <text x="1325" y="1380" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38" letter-spacing="1">DEPLOYMENT DURATION</text>
  <text x="380" y="1350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">Hours</text>
  <text x="800" y="1350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">Days</text>
  <text x="1200" y="1350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">Months</text>
  <text x="1650" y="1350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">Years</text>
  <text x="2150" y="1350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">Decades</text>

  <!-- Y axis: Observation Frequency -->
  <line x1="300" y1="1300" x2="300" y2="200" stroke="#3a3a38" stroke-width="2"/>
  <polygon points="300,192 293,205 307,205" fill="#3a3a38"/>
  <text x="160" y="750" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a3a38" letter-spacing="1" transform="rotate(-90, 160, 750)">OBSERVATION FREQUENCY</text>
  <text x="260" y="1250" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">Low</text>
  <text x="260" y="350" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6a6a68">High</text>

  <!-- Design Opportunity zone -->
  <rect x="1500" y="650" width="800" height="600" rx="8" fill="#b8b5aa" opacity="0.25" stroke="#7a7870" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="1900" y="700" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#4a4a48" letter-spacing="1">DESIGN OPPORTUNITY</text>
  <text x="1900" y="725" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#5a5a58" font-style="italic">Long presence, sustained attention</text>

  <!-- Observation Technologies (dots) -->

  <!-- Ground Sensors: high frequency, short duration -->
  <circle cx="500" cy="350" r="18" fill="#c8c5ba" stroke="#5a5a55" stroke-width="2"/>
  <text x="500" y="310" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#2a2a28">Ground Sensors</text>

  <!-- Field Crews: high frequency, short duration -->
  <circle cx="650" cy="450" r="18" fill="#c8c5ba" stroke="#5a5a55" stroke-width="2"/>
  <text x="650" y="410" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#2a2a28">Field Crews</text>

  <!-- Drones: high frequency, very short duration -->
  <circle cx="400" cy="400" r="18" fill="#c8c5ba" stroke="#5a5a55" stroke-width="2"/>
  <text x="400" y="440" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#2a2a28">Drones</text>

  <!-- Satellite: medium frequency, long duration -->
  <circle cx="1400" cy="500" r="18" fill="#c8c5ba" stroke="#5a5a55" stroke-width="2"/>
  <text x="1400" y="465" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#2a2a28">Satellite</text>

  <!-- Generational Robots: low frequency, very long duration -->
  <circle cx="1900" cy="1050" r="24" fill="#c8c5ba" stroke="#3a3a38" stroke-width="2.5"/>
  <text x="1900" y="1010" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a2a28">Generational</text>
  <text x="1900" y="1035" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a2a28">Robots</text>

  <!-- Ecological Process reference lines (dashed, horizontal) -->
  
  <!-- Leaf phenology — fast process -->
  <line x1="700" y1="400" x2="2300" y2="400" stroke="#7a7870" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <text x="2310" y="405" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7a7870" font-style="italic">Leaf phenology</text>

  <!-- Annual flooding -->
  <line x1="700" y1="600" x2="2300" y2="600" stroke="#7a7870" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <text x="2310" y="605" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7a7870" font-style="italic">Annual flooding</text>

  <!-- Channel migration — slow process -->
  <line x1="700" y1="900" x2="2300" y2="900" stroke="#7a7870" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <text x="2310" y="905" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7a7870" font-style="italic">Channel migration</text>

  <!-- Forest succession -->
  <line x1="700" y1="1050" x2="2300" y2="1050" stroke="#7a7870" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <text x="2310" y="1055" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7a7870" font-style="italic">Forest succession</text>

  <!-- Geomorphic evolution — slowest -->
  <line x1="700" y1="1200" x2="2300" y2="1200" stroke="#7a7870" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <text x="2310" y="1205" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7a7870" font-style="italic">Geomorphic evolution</text>

  <!-- Figure label -->
  <text x="150" y="1600" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#7a7a70">Fig 07-E1 — Cantrell 2026</text>
</svg>
