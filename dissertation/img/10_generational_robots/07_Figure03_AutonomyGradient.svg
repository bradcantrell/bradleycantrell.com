<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="1100" height="500" fill="#0d0d0d"/>

  <!-- Title -->
  <text x="550" y="48" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="3">THE AUTONOMY GRADIENT</text>
  <text x="550" y="70" text-anchor="middle" fill="#888888" font-size="12" letter-spacing="2">From Pre-Programmed Response to Cultivated Wildness</text>

  <!-- Gradient bar -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#2a4a6c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a5c3a;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#3a5c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7c1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="80" y="200" width="940" height="60" rx="4" fill="url(#grad)" stroke="#333333" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="80" y="195" text-anchor="middle" fill="#4a9eff" font-size="11">PRE-PROGRAMMED</text>
  <text x="1020" y="195" text-anchor="middle" fill="#4aff91" font-size="11">AUTONOMOUS</text>

  <!-- Tick marks and project labels -->
  <!-- 1: Thermostat / fixed threshold -->
  <line x1="130" y1="260" x2="130" y2="300" stroke="#ffffff" stroke-width="1"/>
  <circle cx="130" cy="230" r="8" fill="#4a9eff" stroke="none"/>
  <text x="130" y="320" text-anchor="middle" fill="#aaaaaa" font-size="10">Thermostat</text>
  <text x="130" y="335" text-anchor="middle" fill="#666666" font-size="9">Fixed threshold</text>
  <text x="130" y="350" text-anchor="middle" fill="#666666" font-size="9">automation</text>

  <!-- 2: Ambient Space / Thresholds -->
  <line x1="270" y1="260" x2="270" y2="300" stroke="#ffffff" stroke-width="1"/>
  <circle cx="270" cy="230" r="8" fill="#6a9eff" stroke="none"/>
  <text x="270" y="320" text-anchor="middle" fill="#aaaaaa" font-size="10">Thresholds /</text>
  <text x="270" y="335" text-anchor="middle" fill="#aaaaaa" font-size="10">Ambient Space</text>
  <text x="270" y="350" text-anchor="middle" fill="#666666" font-size="9">Reactive sensing</text>

  <!-- 3: Sedimachine / REAL -->
  <line x1="450" y1="260" x2="450" y2="300" stroke="#ffffff" stroke-width="1"/>
  <circle cx="450" cy="230" r="8" fill="#4aff91" stroke="none"/>
  <text x="450" y="320" text-anchor="middle" fill="#aaaaaa" font-size="10">Sedimachine /</text>
  <text x="450" y="335" text-anchor="middle" fill="#aaaaaa" font-size="10">REAL Lab</text>
  <text x="450" y="350" text-anchor="middle" fill="#666666" font-size="9">Programmable</text>
  <text x="450" y="363" text-anchor="middle" fill="#666666" font-size="9">responsivity</text>

  <!-- 4: Nest / ML learning -->
  <line x1="630" y1="260" x2="630" y2="300" stroke="#ffffff" stroke-width="1"/>
  <circle cx="630" cy="230" r="8" fill="#8aff91" stroke="none"/>
  <text x="630" y="320" text-anchor="middle" fill="#aaaaaa" font-size="10">UVA Lab / Nest</text>
  <text x="630" y="335" text-anchor="middle" fill="#666666" font-size="9">Machine learning —</text>
  <text x="630" y="348" text-anchor="middle" fill="#666666" font-size="9">learns from context</text>

  <!-- 5: Algorithmic Cultivation -->
  <line x1="800" y1="260" x2="800" y2="300" stroke="#ffffff" stroke-width="1"/>
  <circle cx="800" cy="230" r="8" fill="#c0ff91" stroke="none"/>
  <text x="800" y="320" text-anchor="middle" fill="#aaaaaa" font-size="10">Algorithmic</text>
  <text x="800" y="335" text-anchor="middle" fill="#aaaaaa" font-size="10">Cultivation</text>
  <text x="800" y="350" text-anchor="middle" fill="#666666" font-size="9">Interspecies</text>
  <text x="800" y="363" text-anchor="middle" fill="#666666" font-size="9">feedback</text>

  <!-- 6: Wildness Creator -->
  <line x1="970" y1="260" x2="970" y2="300" stroke="#ffffff" stroke-width="1"/>
  <circle cx="970" cy="230" r="10" fill="#4aff40" stroke="#ffffff" stroke-width="1.5"/>
  <text x="970" y="320" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Wildness</text>
  <text x="970" y="335" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Creator</text>
  <text x="970" y="352" text-anchor="middle" fill="#888888" font-size="9">Operations become</text>
  <text x="970" y="365" text-anchor="middle" fill="#888888" font-size="9">incomprehensible</text>
  <text x="970" y="378" text-anchor="middle" fill="#888888" font-size="9">to humans</text>

  <!-- Top labels: Human agency -->
  <text x="130" y="160" text-anchor="middle" fill="#4a9eff" font-size="10">High human</text>
  <text x="130" y="173" text-anchor="middle" fill="#4a9eff" font-size="10">control</text>
  <text x="970" y="160" text-anchor="middle" fill="#4aff91" font-size="10">High biological</text>
  <text x="970" y="173" text-anchor="middle" fill="#4aff91" font-size="10">autonomy</text>

  <!-- Arrow -->
  <line x1="80" y1="140" x2="1020" y2="140" stroke="#555555" stroke-width="0.8"/>
  <polygon points="1020,136 1030,140 1020,144" fill="#555555"/>

  <!-- Footer -->
  <text x="550" y="460" text-anchor="middle" fill="#444444" font-size="10" letter-spacing="1">Bradley Cantrell — Adaptive Epistemologies and Neo-Wilds — Virginia Tech PhD 2026</text>
</svg>