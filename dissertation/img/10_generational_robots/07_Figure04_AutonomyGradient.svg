<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="480" fill="#d5d4ca"/>

  <text x="550" y="44" text-anchor="middle" fill="#2a2825" font-size="20" font-weight="bold" letter-spacing="2">THE AUTONOMY GRADIENT</text>
  <text x="550" y="64" text-anchor="middle" fill="#6b6860" font-size="12" letter-spacing="1">From Pre-Programmed Response to Cultivated Wildness</text>
  <line x1="100" y1="74" x2="1000" y2="74" stroke="#b5b4b0" stroke-width="0.5"/>

  <!-- Arrow axis -->
  <line x1="80" y1="155" x2="1040" y2="155" stroke="#b5b4b0" stroke-width="0.8"/>
  <polygon points="1040,151 1050,155 1040,159" fill="#b5b4b0"/>
  <text x="80" y="145" text-anchor="middle" fill="#4a6fa5" font-size="10">High human control</text>
  <text x="1020" y="145" text-anchor="middle" fill="#4a7a4a" font-size="10">High biological autonomy</text>

  <!-- Gradient bar -->
  <defs>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c5d5e8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#c5d8c5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a8c8a8;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect x="80" y="165" width="960" height="50" rx="3" fill="url(#gradLight)" stroke="#b5b4b0" stroke-width="0.8"/>

  <!-- Left/right labels -->
  <text x="80" y="238" text-anchor="middle" fill="#4a6fa5" font-size="10" font-weight="bold">PRE-PROGRAMMED</text>
  <text x="1040" y="238" text-anchor="middle" fill="#4a7a4a" font-size="10" font-weight="bold">AUTONOMOUS</text>

  <!-- Point 1: Articulated Infrastructure x=130 -->
  <line x1="130" y1="215" x2="130" y2="255" stroke="#6b6860" stroke-width="0.75"/>
  <circle cx="130" cy="190" r="7" fill="#d5d4ca" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="130" y="268" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Articulated</text>
  <text x="130" y="282" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Infrastructure</text>
  <text x="130" y="296" text-anchor="middle" fill="#6b6860" font-size="10">Fixed threshold</text>
  <text x="130" y="309" text-anchor="middle" fill="#6b6860" font-size="10">automation</text>

  <!-- Point 2: Thresholds / Ambient Space x=270 -->
  <line x1="270" y1="215" x2="270" y2="255" stroke="#6b6860" stroke-width="0.75"/>
  <circle cx="270" cy="190" r="7" fill="#d5d4ca" stroke="#5a7ab5" stroke-width="1.5"/>
  <text x="270" y="268" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Thresholds /</text>
  <text x="270" y="282" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Ambient Space</text>
  <text x="270" y="296" text-anchor="middle" fill="#6b6860" font-size="10">Reactive sensing</text>

  <!-- Point 3: Sedimachine / REAL x=480 -->
  <line x1="480" y1="215" x2="480" y2="255" stroke="#6b6860" stroke-width="0.75"/>
  <circle cx="480" cy="190" r="7" fill="#d5d4ca" stroke="#5a8a5a" stroke-width="1.5"/>
  <text x="480" y="268" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Sedimachine /</text>
  <text x="480" y="282" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">REAL Lab</text>
  <text x="480" y="296" text-anchor="middle" fill="#6b6860" font-size="10">Programmable</text>
  <text x="480" y="309" text-anchor="middle" fill="#6b6860" font-size="10">responsivity</text>

  <!-- Point 4: Algorithmic Cultivation x=660 -->
  <line x1="660" y1="215" x2="660" y2="255" stroke="#6b6860" stroke-width="0.75"/>
  <circle cx="660" cy="190" r="7" fill="#d5d4ca" stroke="#6a8a5a" stroke-width="1.5"/>
  <text x="660" y="268" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Algorithmic</text>
  <text x="660" y="282" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Cultivation</text>
  <text x="660" y="296" text-anchor="middle" fill="#6b6860" font-size="10">Interspecies feedback</text>

  <!-- Point 5: UVA Geomorphology Experiments x=820 -->
  <line x1="820" y1="215" x2="820" y2="255" stroke="#6b6860" stroke-width="0.75"/>
  <circle cx="820" cy="190" r="7" fill="#d5d4ca" stroke="#4a7a4a" stroke-width="1.5"/>
  <text x="820" y="268" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">UVA Geomorphology</text>
  <text x="820" y="282" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="600">Experiments</text>
  <text x="820" y="296" text-anchor="middle" fill="#6b6860" font-size="10">Machine learning —</text>
  <text x="820" y="309" text-anchor="middle" fill="#6b6860" font-size="10">learns from context</text>

  <!-- Point 6: Wildness Creator x=990 -->
  <line x1="990" y1="215" x2="990" y2="255" stroke="#6b6860" stroke-width="0.75"/>
  <circle cx="990" cy="190" r="9" fill="#d5d4ca" stroke="#2a5a2a" stroke-width="2"/>
  <text x="990" y="268" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="bold">Wildness</text>
  <text x="990" y="282" text-anchor="middle" fill="#2a2825" font-size="11" font-weight="bold">Creator</text>
  <text x="990" y="296" text-anchor="middle" fill="#6b6860" font-size="10">Operations become</text>
  <text x="990" y="309" text-anchor="middle" fill="#6b6860" font-size="10">incomprehensible</text>
  <text x="990" y="322" text-anchor="middle" fill="#6b6860" font-size="10">to humans</text>

  <text x="550" y="450" text-anchor="middle" fill="#9b9a96" font-size="10">Bradley Cantrell — Adaptive Epistemologies and Neo-Wilds — Virginia Tech PhD 2026</text>
</svg>
