  <g id="layer-author-columns" inkscape:groupmode="layer" inkscape:label="Author Columns">
    <rect class="st2" x="227.05" y="405.4" width="300" height="320" rx="10" ry="10"/>
    <text class="st6" transform="translate(292.46 475.4)"><tspan x="0" y="0">HUMAN DESIGNER</tspan></text>
    <line class="st3" x1="297.05" y1="500.4" x2="457.05" y2="500.4"/>
    <text class="st8" transform="translate(308.66 545.4)"><tspan x="0" y="0">Proposes. Calibrates.</tspan></text>
    <text class="st8" transform="translate(275.47 570.4)"><tspan x="0" y="0">Does not determine outcomes.</tspan></text>
    <text class="st9" transform="translate(362.67 610.4)"><tspan x="0" y="0">Years</tspan></text>
    <line class="st0" x1="377.05" y1="725.4" x2="377.05" y2="865.4"/>
    <rect class="st2" x="627.05" y="405.4" width="300" height="320" rx="10" ry="10"/>
    <text class="st5" transform="translate(679.64 475.4)"><tspan x="0" y="0">BIOLOGICAL AGENTS</tspan></text>
    <line class="st3" x1="697.05" y1="500.4" x2="857.05" y2="500.4"/>
    <text class="st8" transform="translate(681.49 545.4)"><tspan x="0" y="0">Grow, evolve, resist, surprise.</tspan></text>
    <text class="st8" transform="translate(722.08 570.4)"><tspan x="0" y="0">Author the form.</tspan></text>
    <text class="st9" transform="translate(722.13 610.4)"><tspan x="0" y="0">Seasons to centuries</tspan></text>
    <line class="st0" x1="777.05" y1="725.4" x2="777.05" y2="865.4"/>
    <rect class="st2" x="1027.05" y="405.4" width="300" height="320" rx="10" ry="10"/>
    <text class="st6" transform="translate(1075.7689 475.3969)"><tspan x="0" y="0">MATERIAL PROCESSES</tspan></text>
    <line class="st3" x1="1097.05" y1="500.4" x2="1257.05" y2="500.4"/>
    <text class="st8" transform="translate(1067.2758 545.3969)"><tspan x="0" y="0">Sediment sorts. Water finds level.</tspan></text>
    <text class="st8" transform="translate(1132.8594 570.3969)"><tspan x="0" y="0">Geology acts.</tspan></text>
    <text class="st9" transform="translate(1121.0386 610.3969)"><tspan x="0" y="0">Decades to millennia</tspan></text>
    <line class="st0" x1="1177.05" y1="725.4" x2="1177.05" y2="865.4"/>
    <rect class="st2" x="1427.05" y="405.4" width="300" height="320" rx="10" ry="10"/>
    <text class="st6" transform="translate(1514.2526 475.3969)"><tspan x="0" y="0">ALGORITHMS</tspan></text>
    <line class="st3" x1="1497.05" y1="500.4" x2="1657.05" y2="500.4"/>
    <text class="st8" transform="translate(1462.8096 545.3969)"><tspan x="0" y="0">Detect patterns. Trigger responses.</tspan></text>
    <text class="st8" transform="translate(1505.6606 570.3969)"><tspan x="0" y="0">Mediate the coupling.</tspan></text>
    <text class="st9" transform="translate(1521.4055 610.3969)"><tspan x="0" y="0">Milliseconds to years</tspan></text>
    <line class="st0" x1="1577.05" y1="725.4" x2="1577.05" y2="865.4"/>
    <rect class="st2" x="1827.05" y="405.4" width="300" height="320" rx="10" ry="10"/>
    <text class="st6" transform="translate(1910.1488 475.3969)"><tspan x="0" y="0">COMMUNITIES</tspan></text>
    <line class="st3" x1="1897.05" y1="500.4" x2="2057.05" y2="500.4"/>
    <text class="st8" transform="translate(1870.587 545.3969)"><tspan x="0" y="0">Inhabit. Observe. Carry memory.</tspan></text>
    <text class="st8" transform="translate(1904.2584 570.3969)"><tspan x="0" y="0">Navigate the territory.</tspan></text>
    <text class="st9" transform="translate(1944.4121 610.3969)"><tspan x="0" y="0">Generations</tspan></text>
    <line class="st0" x1="1977.05" y1="725.4" x2="1977.05" y2="865.4"/>
