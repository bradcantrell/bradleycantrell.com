    <text class="st10" transform="translate(215.61 247.4)"><tspan x="0" y="0">Distributed Authorship</tspan></text>
    <text class="st7" transform="translate(217.61 281.4)"><tspan x="0" y="0">Who authors a neo-wild landscape</tspan></text>
