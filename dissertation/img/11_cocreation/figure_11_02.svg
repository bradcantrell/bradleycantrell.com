    <text class="st7" transform="translate(699.77 871.47) rotate(-47)"><tspan x="0" y="0">Intention shapes computation.</tspan></text>
    <text class="st7" transform="translate(724.1 899.55) rotate(-47)"><tspan x="0" y="0">Computation extends perception.</tspan></text>
    <text class="st7" transform="translate(1734.9482 747.769) rotate(46.9998)"><tspan x="0" y="0">Instruments pose questions.</tspan></text>
    <text class="st7" transform="translate(1692.4502 756.3662) rotate(46.9998)"><tspan x="0" y="0">Territory answers through process.</tspan></text>
