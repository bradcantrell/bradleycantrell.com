    <text class="st11" transform="translate(1149.5791 1215.8651)"><tspan x="0" y="0">Knowledge emerges from the interaction</tspan></text>
    <text class="st11" transform="translate(1149.4592 1237.8651)"><tspan x="0" y="0">and belongs to none of them individually</tspan></text>
