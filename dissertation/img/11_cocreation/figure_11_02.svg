    <text class="st4" transform="translate(1211.1057 431.8651)"><tspan x="0" y="0">MACHINE</tspan></text>
    <text class="st3" transform="translate(1178.3463 461.8651)"><tspan x="0" y="0">INTELLIGENCE</tspan></text>
    <text class="st6" transform="translate(1181.8021 632.0562)"><tspan x="0" y="0">Pattern recognition, sensing,</tspan></text>
    <text class="st6" transform="translate(1203.4434 652.0562)"><tspan x="0" y="0">adaptive computation</tspan></text>
    <text class="st10" transform="translate(1208.8132 602.0562)"><tspan x="0" y="0">The Third Intelligence</tspan></text>
    <text class="st4" transform="translate(448.3257 1311.8651)"><tspan x="0" y="0">HUMAN</tspan></text>
    <text class="st3" transform="translate(403.3464 1341.8651)"><tspan x="0" y="0">INTELLIGENCE</tspan></text>
    <text class="st6" transform="translate(647.4988 1319.2528)"><tspan x="0" y="0">Tacit judgment, intention,</tspan></text>
    <text class="st6" transform="translate(670.8763 1339.2528)"><tspan x="0" y="0">ethical positioning</tspan></text>
    <text class="st4" transform="translate(1966.424 1311.8651)"><tspan x="0" y="0">BIOLOGICAL</tspan></text>
    <text class="st3" transform="translate(1953.3463 1341.8651)"><tspan x="0" y="0">INTELLIGENCE</tspan></text>
    <text class="st6" transform="translate(1791.7201 1316.8651)"><tspan x="0" y="0">Growth, evolution,</tspan></text>
    <text class="st6" transform="translate(1797.8441 1336.8651)"><tspan x="0" y="0">viridic autonomy</tspan></text>
