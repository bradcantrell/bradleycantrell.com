    <text class="st1" transform="translate(1402.0737 581.6938)"><tspan x="0" y="0">COUPLED</tspan></text>
    <text class="st2" transform="translate(1391.2964 609.1255)"><tspan x="0" y="0">ECOLOGIES</tspan></text>
