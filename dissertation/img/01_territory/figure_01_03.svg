  <g id="layer-background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect class="st26" width="2550" height="3300"/>
  </g>
  <g id="layer-header" inkscape:groupmode="layer" inkscape:label="Header">
    <text class="st23" transform="translate(210.77 253.44)"><tspan x="0" y="0">Orphic and Promethean</tspan></text>
    <text class="st18" transform="translate(213.15 298.44)"><tspan x="0" y="0">Attitudes toward nature&apos;s secrets. After Hadot (2006).</tspan></text>
  </g>
  <g id="layer-veil" inkscape:groupmode="layer" inkscape:label="The Veil">
    <circle class="st4" cx="1275" cy="518.44" r="162.43"/>
    <text class="st15" transform="translate(1189.1052 513.4375)"><tspan x="0" y="0">THE VEIL</tspan></text>
    <text class="st22" transform="translate(1196.8811 546.4375)"><tspan x="0" y="0">Nature holds secrets.</tspan></text>
    <text class="st22" transform="translate(1171.2898 570.4375)"><tspan x="0" y="0">How do we approach them?</tspan></text>
  </g>
  <g id="layer-fork" inkscape:groupmode="layer" inkscape:label="Fork">
    <line class="st6" x1="1275" y1="680.87" x2="1275" y2="738.44"/>
    <circle class="st24" cx="1275" cy="748.44" r="10"/>
    <line class="st0" x1="1275" y1="748.44" x2="780" y2="954.74"/>
    <line class="st1" x1="1275" y1="748.44" x2="1766.22" y2="963.91"/>
  </g>
  <g id="layer-promethean" inkscape:groupmode="layer" inkscape:label="Promethean Path">
    <circle class="st8" cx="640" cy="1038.44" r="160"/>
    <text class="st13" transform="translate(514.3885 1028.4375)"><tspan x="0" y="0">PROMETHEAN</tspan></text>
    <text class="st22" transform="translate(573.4191 1060.4375)"><tspan x="0" y="0">Tear the veil away</tspan></text>
    <line class="st9" x1="640" y1="1158.44" x2="640" y2="1198.44"/>
    <text class="st17" transform="translate(484.8295 1228.4375)"><tspan x="0" y="0">Bacon. Descartes. The mechanistic tradition.</tspan></text>
    <text class="st17" transform="translate(457.3535 1253.4375)"><tspan x="0" y="0">Nature as resource. Knowledge through domination.</tspan></text>
    <line class="st2" x1="500" y1="1288.44" x2="780" y2="1288.44"/>
    <text class="st12" transform="translate(559.1086 1328.4375)"><tspan x="0" y="0">Force and extraction</tspan></text>
    <text class="st12" transform="translate(565.1475 1358.4375)"><tspan x="0" y="0">Predict and control</tspan></text>
    <text class="st12" transform="translate(536.4872 1388.4375)"><tspan x="0" y="0">Model enforces prediction</tspan></text>
    <text class="st12" transform="translate(548.3221 1418.4375)"><tspan x="0" y="0">Optimize toward target</tspan></text>
    <text class="st12" transform="translate(556.6215 1448.4375)"><tspan x="0" y="0">Failure is Catastrophic</tspan></text>
    <line class="st2" x1="500" y1="1488.44" x2="780" y2="1488.44"/>
    <text class="st17" transform="translate(511.8813 1528.4375)"><tspan x="0" y="0">Mississippi River Basin Model (1943)</tspan></text>
    <text class="st17" transform="translate(572.1326 1556.4375)"><tspan x="0" y="0">HEC-RAS. Delft3D.</tspan></text>
    <text class="st17" transform="translate(577.6041 1584.4375)"><tspan x="0" y="0">The levee system.</tspan></text>
    <text class="st19" transform="translate(466.2571 1658.4375)"><tspan x="0" y="0">River rendered as hydraulic system in concrete channels.</tspan></text>
    <text class="st19" transform="translate(487.1186 1683.4375)"><tspan x="0" y="0">Biological, social, geomorphic dynamics excluded.</tspan></text>
    <line class="st2" x1="500" y1="1718.44" x2="780" y2="1718.44"/>
    <text class="st16" transform="translate(502.4133 1758.4375)"><tspan x="0" y="0">Succeeds into failure at territorial scale.</tspan></text>
  </g>
  <g id="layer-orphic" inkscape:groupmode="layer" inkscape:label="Orphic Path">
    <circle class="st3" cx="1910" cy="1038.44" r="155.64"/>
    <text class="st14" transform="translate(1839.2125 1028.4375)"><tspan x="0" y="0">ORPHIC</tspan></text>
    <text class="st22" transform="translate(1845.8801 1060.4375)"><tspan x="0" y="0">Attend to the veil</tspan></text>
    <line class="st9" x1="1910" y1="1158.44" x2="1910" y2="1198.44"/>
    <text class="st17" transform="translate(1816.9409 1228.4375)"><tspan x="0" y="0">Goethe. Heraclitus. Hadot.</tspan></text>
    <text class="st17" transform="translate(1730.8058 1253.4375)"><tspan x="0" y="0">Delicate empiricism. Knowledge through attending.</tspan></text>
    <line class="st2" x1="1770" y1="1288.44" x2="2050" y2="1288.44"/>
    <text class="st12" transform="translate(1803.7521 1328.4375)"><tspan x="0" y="0">Attention and participation</tspan></text>
    <text class="st12" transform="translate(1845.2277 1358.4375)"><tspan x="0" y="0">Learn and adjust</tspan></text>
    <text class="st12" transform="translate(1795.8447 1388.4375)"><tspan x="0" y="0">Territory reveals processes</tspan></text>
    <text class="st12" transform="translate(1827.1602 1418.4375)"><tspan x="0" y="0">Design as hypothesis</tspan></text>
    <text class="st12" transform="translate(1834.9794 1448.4375)"><tspan x="0" y="0">Productive Failure</tspan></text>
    <line class="st2" x1="1770" y1="1488.44" x2="2050" y2="1488.44"/>
    <text class="st17" transform="translate(1778.3813 1528.4375)"><tspan x="0" y="0">Thresholds (2006). Sensing as inquiry.</tspan></text>
    <text class="st17" transform="translate(1802.5977 1556.4375)"><tspan x="0" y="0">Algorithmic Cultivation (2019).</tspan></text>
    <text class="st17" transform="translate(1788.8378 1584.4375)"><tspan x="0" y="0">The geomorphology table (2017–).</tspan></text>
    <text class="st19" transform="translate(1778.4182 1658.4375)"><tspan x="0" y="0">Territory as participant in its own legibility.</tspan></text>
    <text class="st19" transform="translate(1741.7694 1683.4375)"><tspan x="0" y="0">Knowledge produced through coupling, not extraction.</tspan></text>
    <line class="st2" x1="1770" y1="1718.44" x2="2050" y2="1718.44"/>
    <text class="st16" transform="translate(1751.0575 1758.4375)"><tspan x="0" y="0">Requires sustained relationship with territory.</tspan></text>
    <text class="st16" transform="translate(1800.0847 1786.4375)"><tspan x="0" y="0">The commitment is irreversible.</tspan></text>
    <text class="st16" transform="translate(1746.9735 1810.4375)"><tspan x="0" y="0">The knowledge is lost when the coupling ends.</tspan></text>
  </g>
  <g id="layer-convergence" inkscape:groupmode="layer" inkscape:label="Convergence">
    <line class="st7" x1="640" y1="1848.44" x2="1050" y2="2148.44"/>
    <line class="st7" x1="1910" y1="1848.44" x2="1500" y2="2148.44"/>
    <text class="st11" transform="translate(742.6488 1998.4378) rotate(-20)"><tspan x="0" y="0">tools</tspan></text>
    <text class="st11" transform="translate(1758.0836 1984.3287) rotate(20)"><tspan x="0" y="0">orientation</tspan></text>
  </g>
  <g id="layer-synthesis" inkscape:groupmode="layer" inkscape:label="Synthesis">
    <rect class="st5" x="800" y="2138.44" width="950" height="340" rx="12" ry="12"/>
    <text class="st25" transform="translate(1067.3702 2238.4375)"><tspan x="0" y="0">AN ORPHIC PROJECT</tspan></text>
    <text class="st25" transform="translate(1086.8073 2288.4375)"><tspan x="0" y="0">CONDUCTED WITH</tspan></text>
    <text class="st25" transform="translate(1062.2021 2338.4375)"><tspan x="0" y="0">PROMETHEAN TOOLS</tspan></text>
    <text class="st20" transform="translate(1160.5614 2398.4375)"><tspan x="0" y="0">The dissertation&apos;s position</tspan></text>
    <text class="st20" transform="translate(1171.8612 2428.4375)"><tspan x="0" y="0">Adaptive epistemology</tspan></text>
  </g>
  <g id="layer-synthesis-annotations" inkscape:groupmode="layer" inkscape:label="Synthesis Annotations">
    <text class="st21" transform="translate(1046.7991 2578.4375)"><tspan x="0" y="0">Computational sensing. Robotic infrastructure. Machine learning.</tspan></text>
    <text class="st21" transform="translate(1079.0304 2608.4375)"><tspan x="0" y="0">Distributed monitoring. Algorithmic pattern recognition.</tspan></text>
    <line class="st10" x1="900" y1="2648.44" x2="1650" y2="2648.44"/>
    <text class="st21" transform="translate(1060.8667 2688.4375)"><tspan x="0" y="0">Deployed in an orientation that attends rather than enforces.</tspan></text>
    <text class="st21" transform="translate(1144.9474 2718.4375)"><tspan x="0" y="0">Attentive to what the system reveals.</tspan></text>
    <text class="st21" transform="translate(1083.5491 2748.4375)"><tspan x="0" y="0">Not determined to make it confirm model predictions</tspan></text>
    <line class="st10" x1="900" y1="2788.44" x2="1650" y2="2788.44"/>
    <text class="st21" transform="translate(1069.8932 2838.4375)"><tspan x="0" y="0">That tension is the condition of practice at territorial scale.</tspan></text>
  </g>
</svg>