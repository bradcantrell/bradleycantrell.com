<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2550 1650" width="2550" height="1650">
  <!-- Background -->
  <rect width="2550" height="1650" fill="#d5d4ca"/>

  <!-- Main Title -->
  <text x="1275" y="100" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#2a2a2a" letter-spacing="1">Static vs. Adaptive Models of Landscape</text>
  <text x="1275" y="145" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="300" fill="#5a5a5a" font-style="italic">The fundamental reorientation from predict-and-control to learn-and-adjust</text>

  <!-- Divider line -->
  <line x1="1275" y1="195" x2="1275" y2="1520" stroke="#8a8a80" stroke-width="1" stroke-dasharray="8,6" opacity="0.4"/>

  <!-- ============ LEFT SIDE: STATIC ============ -->
  
  <!-- Column Title -->
  <text x="580" y="240" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#3a3a38" letter-spacing="4">STATIC</text>

  <!-- 5 boxes: 460w x 110h, left edge at 350 -->
  <!-- Neutral warm gray: fill #c8c5ba, stroke #7a7870 -->
  
  <!-- Box 1: Survey & inventory -->
  <rect x="350" y="300" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="580" y="362" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Survey &amp; inventory</text>

  <!-- Arrow 1→2 (left side of boxes) -->
  <line x1="344" y1="410" x2="344" y2="455" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="344,462 339,452 349,452" fill="#5a5a55"/>

  <!-- Box 2: Predict future state -->
  <rect x="350" y="465" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="580" y="527" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Predict future state</text>

  <!-- Arrow 2→3 -->
  <line x1="344" y1="575" x2="344" y2="620" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="344,627 339,617 349,617" fill="#5a5a55"/>

  <!-- Box 3: Specify fixed design -->
  <rect x="350" y="630" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="580" y="692" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Specify fixed design</text>

  <!-- Arrow 3→4 -->
  <line x1="344" y1="740" x2="344" y2="785" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="344,792 339,782 349,782" fill="#5a5a55"/>

  <!-- Box 4: Build & construct -->
  <rect x="350" y="795" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="580" y="857" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Build &amp; construct</text>

  <!-- Arrow 4→5 -->
  <line x1="344" y1="905" x2="344" y2="950" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="344,957 339,947 349,947" fill="#5a5a55"/>

  <!-- Box 5: Maintain in perpetuity -->
  <rect x="350" y="960" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="580" y="1022" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Maintain in perpetuity</text>


  <!-- ============ RIGHT SIDE: ADAPTIVE ============ -->
  
  <!-- Column Title -->
  <text x="1970" y="240" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#3a3a38" letter-spacing="4">ADAPTIVE</text>

  <!-- Same neutral palette as left side -->
  
  <!-- Box 1: Design proposition (as hypothesis) -->
  <rect x="1740" y="300" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="1970" y="350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#2a2a28">Design proposition</text>
  <text x="1970" y="378" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#4a4a48" font-style="italic">(as hypothesis)</text>

  <!-- Arrow 1→2 (left side of boxes) -->
  <line x1="1734" y1="410" x2="1734" y2="455" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="1734,462 1729,452 1739,452" fill="#5a5a55"/>

  <!-- Box 2: Implement & observe -->
  <rect x="1740" y="465" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="1970" y="527" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Implement &amp; observe</text>

  <!-- Arrow 2→3 -->
  <line x1="1734" y1="575" x2="1734" y2="620" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="1734,627 1729,617 1739,617" fill="#5a5a55"/>

  <!-- Box 3: Sense & monitor conditions -->
  <rect x="1740" y="630" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="1970" y="692" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#2a2a28">Sense &amp; monitor conditions</text>

  <!-- Arrow 3→4 -->
  <line x1="1734" y1="740" x2="1734" y2="785" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="1734,792 1729,782 1739,782" fill="#5a5a55"/>

  <!-- Box 4: Interpret what the landscape reveals -->
  <rect x="1740" y="795" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="1970" y="845" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#2a2a28">Interpret what the</text>
  <text x="1970" y="873" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#2a2a28">landscape reveals</text>

  <!-- Arrow 4→5 -->
  <line x1="1734" y1="905" x2="1734" y2="950" stroke="#5a5a55" stroke-width="1.5"/>
  <polygon points="1734,957 1729,947 1739,947" fill="#5a5a55"/>

  <!-- Box 5: Revise proposition & adjust -->
  <rect x="1740" y="960" width="460" height="110" rx="8" fill="#c8c5ba" stroke="#7a7870" stroke-width="1.5"/>
  <text x="1970" y="1022" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#2a2a28">Revise proposition &amp; adjust</text>

  <!-- FEEDBACK ARROW: right side, straight vertical from bottom of box 5 to top of box 1 -->
  <!-- Starts at bottom-right of box 5, goes down, then straight up to top of box 1 -->
  <path d="M 2200,1015 L 2210,1015 L 2210,355 " stroke="#3a3a38" stroke-width="2.5" fill="none"/>
  <!-- Arrowhead pointing up -->
  <polygon points="2210,300 2204,316 2216,316" fill="#3a3a38"/>

  <!-- Figure label -->
  <text x="150" y="1600" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#7a7a70">Fig 01-D1 — Cantrell 2026</text>
</svg>
