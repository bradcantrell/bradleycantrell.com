    <text class="st14" transform="translate(1088.3019 731)"><tspan x="0" y="0">MAINTENANCE</tspan></text>
    <text class="st9" transform="translate(1164.7524 776)"><tspan x="0" y="0">THE PRIMARY DESIGN ACT</tspan></text>
    <line class="st6" x1="847.49" y1="816" x2="1797.49" y2="816"/>
    <text class="st8" transform="translate(1199.2727 866)"><tspan x="0" y="0">Observation. Adjustment. Care.</tspan></text>
    <text class="st8" transform="translate(1180.5961 896)"><tspan x="0" y="0">Accumulated small acts across time.</tspan></text>
    <text class="st12" transform="translate(1053.8314 932)"><tspan x="0" y="0">The relationship, not the artifact, is the design outcome.</tspan></text>
    <text class="st12" transform="translate(1023.4827 967)"><tspan x="0" y="0">The landscape emerges from the tending, not the specification.</tspan></text>
  </g>
