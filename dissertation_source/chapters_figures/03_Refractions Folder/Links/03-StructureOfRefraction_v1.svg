  <g id="layer-hero" inkscape:groupmode="layer" inkscape:label="Hero">
    <rect class="st15" x="306.57" y="1063.21" width="1936.87" height="252" rx="10" ry="10"/>
    <text class="st6" transform="translate(1075.0541 1175.2109)"><tspan x="0" y="0">REFRACTION</tspan></text>
    <text class="st8" transform="translate(1061.223 1240.2109)"><tspan x="0" y="0">The method that emerges when the four conditions co-occur.</tspan></text>
    <text class="st8" transform="translate(983.335 1270.2109)"><tspan x="0" y="0">Knowledge produced in the gap between instrumental framing and critical retelling.</tspan></text>
  </g>
  <g id="layer-transposition" inkscape:groupmode="layer" inkscape:label="Transposition">
    <line class="st13" x1="760" y1="1410.37" x2="1790" y2="1410.37"/>
    <text class="st0" transform="translate(1097.2217 1450.3715)"><tspan x="0" y="0">THE STRUCTURE TRANSPOSES</tspan></text>
    <g id="contexts">
      <text class="st2" transform="translate(341.768 1360.3715)"><tspan x="0" y="0">Doctoral research in</tspan></text>
      <text class="st2" transform="translate(324.0197 1388.3715)"><tspan x="0" y="0">practice-based disciplines</tspan></text>
      <text class="st2" transform="translate(1191.0529 1360.3715)"><tspan x="0" y="0">Peer-reviewed studio and</tspan></text>
      <text class="st2" transform="translate(1193.8842 1388.3715)"><tspan x="0" y="0">design research contexts</tspan></text>
      <text class="st2" transform="translate(2058.3462 1360.3715)"><tspan x="0" y="0">Institutional practice with</tspan></text>
      <text class="st2" transform="translate(2054.4082 1388.3715)"><tspan x="0" y="0">documented case histories</tspan></text>
      <line class="st9" x1="298" y1="1410.37" x2="518" y2="1410.37"/>
      <line class="st9" x1="2022" y1="1410.37" x2="2262" y2="1410.37"/>
    </g>
  </g>
