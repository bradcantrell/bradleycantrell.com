  <g id="layer-header" inkscape:groupmode="layer" inkscape:label="Header">
    <text class="st5" transform="translate(215.78 247.21)"><tspan x="0" y="0">The Structure of Refraction</tspan></text>
    <text class="st1" transform="translate(217.54 281.21)"><tspan x="0" y="0">Four conditions that make the method transposable</tspan></text>
  </g>
  <g id="layer-conditions" inkscape:groupmode="layer" inkscape:label="Conditions">
    <g id="condition-01">
      <text class="st3" transform="translate(374.49 395.21)"><tspan x="0" y="0">ONE</tspan></text>
      <line class="st10" x1="258" y1="417.21" x2="558" y2="417.21"/>
      <text class="st12" transform="translate(346.62 463.21)"><tspan x="0" y="0">REALIZED</tspan></text>
      <text class="st11" transform="translate(344.95 497.21)"><tspan x="0" y="0">PRACTICE</tspan></text>
      <text class="st7" transform="translate(338.93 577.21)"><tspan x="0" y="0">Built, deployed, and</tspan></text>
      <text class="st7" transform="translate(337.83 603.21)"><tspan x="0" y="0">consequential work.</tspan></text>
      <text class="st7" transform="translate(345.3 629.21)"><tspan x="0" y="0">Not hypothesis or</tspan></text>
      <text class="st7" transform="translate(336.52 655.21)"><tspan x="0" y="0">thought experiment.</tspan></text>
      <text class="st7" transform="translate(325.01 681.21)"><tspan x="0" y="0">The practice must leave</tspan></text>
      <text class="st7" transform="translate(334.5 707.21)"><tspan x="0" y="0">material traces in the</tspan></text>
      <text class="st7" transform="translate(386.07 733.21)"><tspan x="0" y="0">world.</tspan></text>
    </g>
    <g id="condition-02">
      <text class="st3" transform="translate(950.58 395.21)"><tspan x="0" y="0">TWO</tspan></text>
      <line class="st10" x1="836" y1="417.21" x2="1136" y2="417.21"/>
      <text class="st12" transform="translate(916.47 463.21)"><tspan x="0" y="0">SUSTAINED</tspan></text>
      <text class="st11" transform="translate(873.75 497.21)"><tspan x="0" y="0">DOCUMENTATION</tspan></text>
      <text class="st7" transform="translate(914.1 577.21)"><tspan x="0" y="0">Field records, media,</tspan></text>
      <text class="st7" transform="translate(895.95 603.21)"><tspan x="0" y="0">and artifacts accumulated</tspan></text>
      <text class="st7" transform="translate(928.33 629.21)"><tspan x="0" y="0">across the life of</tspan></text>
      <text class="st7" transform="translate(942.62 655.21)"><tspan x="0" y="0">the practice.</tspan></text>
      <text class="st7" transform="translate(905.14 681.21)"><tspan x="0" y="0">The archive that makes</tspan></text>
      <text class="st7" transform="translate(911.88 707.21)"><tspan x="0" y="0">retrospective reading</tspan></text>
      <text class="st7" transform="translate(955.65 733.21)"><tspan x="0" y="0">possible.</tspan></text>
    </g>
    <g id="condition-03">
      <text class="st3" transform="translate(1521.8516 395.2109)"><tspan x="0" y="0">THREE</tspan></text>
      <line class="st10" x1="1414" y1="417.21" x2="1714" y2="417.21"/>
      <text class="st12" transform="translate(1498.1449 463.2109)"><tspan x="0" y="0">EXTERNAL</tspan></text>
      <text class="st12" transform="translate(1451.8612 497.2109)"><tspan x="0" y="0">ACCOUNTABILITY</tspan></text>
      <text class="st7" transform="translate(1475.0927 577.2109)"><tspan x="0" y="0">A structure that demands</tspan></text>
      <text class="st7" transform="translate(1485.8765 603.2109)"><tspan x="0" y="0">the work be read from</tspan></text>
      <text class="st7" transform="translate(1499.925 629.2109)"><tspan x="0" y="0">outside its original</tspan></text>
      <text class="st7" transform="translate(1535.3604 655.2109)"><tspan x="0" y="0">framing.</tspan></text>
      <text class="st7" transform="translate(1473.0011 681.2109)"><tspan x="0" y="0">Committee, panel, or peer</tspan></text>
      <text class="st7" transform="translate(1482.1287 707.2109)"><tspan x="0" y="0">structure that catalyzes</tspan></text>
      <text class="st7" transform="translate(1507.7968 733.2109)"><tspan x="0" y="0">critical distance.</tspan></text>
    </g>
    <g id="condition-04">
      <text class="st3" transform="translate(2103.5896 395.2109)"><tspan x="0" y="0">FOUR</tspan></text>
      <line class="st10" x1="1992" y1="417.21" x2="2292" y2="417.21"/>
      <text class="st12" transform="translate(2081.4243 463.2109)"><tspan x="0" y="0">CRITICAL</tspan></text>
      <text class="st12" transform="translate(2067.853 497.2109)"><tspan x="0" y="0">REREADING</tspan></text>
      <text class="st7" transform="translate(2064.4565 577.2109)"><tspan x="0" y="0">Systematic retelling of</tspan></text>
      <text class="st7" transform="translate(2052.3486 603.2109)"><tspan x="0" y="0">the practice from vantage</tspan></text>
      <text class="st7" transform="translate(2063.9409 629.2109)"><tspan x="0" y="0">points its instrumental</tspan></text>
      <text class="st7" transform="translate(2049.4763 655.2109)"><tspan x="0" y="0">contexts never demanded.</tspan></text>
      <text class="st7" transform="translate(2044.8246 681.2109)"><tspan x="0" y="0">The operation that recovers</tspan></text>
      <text class="st7" transform="translate(2054.2329 707.2109)"><tspan x="0" y="0">what the original framing</tspan></text>
      <text class="st7" transform="translate(2100.6162 733.2109)"><tspan x="0" y="0">suppressed.</tspan></text>
    </g>
  </g>
