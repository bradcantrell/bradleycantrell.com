  <g id="layer-background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect class="st24" width="2550" height="1650"/>
  </g>
  <g id="layer-header" inkscape:groupmode="layer" inkscape:label="Header">
    <text class="st9" transform="translate(251.62 242.49)"><tspan x="0" y="0">Refraction in Practice</tspan></text>
    <text class="st2" transform="translate(253.29 276.49)"><tspan x="0" y="0">One project. Three angles. Three forms of knowledge the instrumental framing could not produce.</tspan></text>
  </g>
  <g id="layer-project-source" inkscape:groupmode="layer" inkscape:label="Project Source">
    <rect class="st14" x="283.79" y="565" width="400" height="340" rx="12" ry="12"/>
    <text class="st0" transform="translate(378.44 665)"><tspan x="0" y="0">ALGORITHMIC</tspan></text>
    <text class="st1" transform="translate(385.45 701)"><tspan x="0" y="0">CULTIVATION</tspan></text>
    <text class="st19" transform="translate(446.41 745)"><tspan x="0" y="0">UVA, 2019</tspan></text>
    <text class="st3" transform="translate(402.58 785)"><tspan x="0" y="0">Robot. Plant. Data feeds.</tspan></text>
    <text class="st3" transform="translate(387.29 810)"><tspan x="0" y="0">One project, read three ways.</tspan></text>
  </g>
  <g id="layer-refraction-mechanism" inkscape:groupmode="layer" inkscape:label="Refraction Mechanism">
    <rect class="st5" x="843.79" y="445" width="420" height="580" rx="14" ry="14"/>
    <text class="st8" transform="translate(896.69 545)"><tspan x="0" y="0">REFRACTION</tspan></text>
    <text class="st15" transform="translate(942.62 585)"><tspan x="0" y="0">The methodological operation</tspan></text>
    <line class="st23" x1="903.79" y1="625" x2="1203.79" y2="625"/>
    <text class="st11" transform="translate(947.25 670)"><tspan x="0" y="0">Passes the same work through</tspan></text>
    <text class="st11" transform="translate(965.12 695)"><tspan x="0" y="0">different narrative media.</tspan></text>
    <text class="st11" transform="translate(961.54 725)"><tspan x="0" y="0">Finds properties that were</tspan></text>
    <text class="st11" transform="translate(955.64 750)"><tspan x="0" y="0">always present but traveling</tspan></text>
    <text class="st11" transform="translate(988.35 775)"><tspan x="0" y="0">invisibly within the</tspan></text>
    <text class="st11" transform="translate(997.32 800)"><tspan x="0" y="0">original framing.</tspan></text>
    <line class="st23" x1="903.79" y1="835" x2="1203.79" y2="835"/>
    <text class="st12" transform="translate(983.8 875)"><tspan x="0" y="0">Not critique. Recovery.</tspan></text>
    <text class="st12" transform="translate(975.12 905)"><tspan x="0" y="0">Not translation. Re-entry.</tspan></text>
  </g>
  <g id="layer-input-beam" inkscape:groupmode="layer" inkscape:label="Input Beam">
    <line class="st21" x1="683.79" y1="735" x2="843.79" y2="735"/>
    <polygon class="st17" points="841.79 735 829.79 729 829.79 741 841.79 735"/>
    <text class="st7" transform="translate(706.47 720)"><tspan x="0" y="0">instrumental account</tspan></text>
  </g>
  <g id="layer-output-beams" inkscape:groupmode="layer" inkscape:label="Output Beams">
    <line class="st20" x1="1263.79" y1="485" x2="1513.79" y2="485"/>
    <polygon class="st18" points="1518.79 485 1506.79 479 1506.79 491 1518.79 485"/>
    <rect class="st14" x="1533.79" y="405" width="350" height="160" rx="10" ry="10"/>
    <text class="st10" transform="translate(1587.9773 455)"><tspan x="0" y="0">TECHNOGEOGRAPHIES</tspan></text>
    <text class="st10" transform="translate(1646.3167 480)"><tspan x="0" y="0">OF SENSING</tspan></text>
    <text class="st6" transform="translate(1692.224 515)"><tspan x="0" y="0">Ch 07</tspan></text>
    <line class="st22" x1="1883.79" y1="485" x2="1993.79" y2="485"/>
    <text class="st16" transform="translate(2013.7858 462)"><tspan x="0" y="0">What the data feeds revealed</tspan></text>
    <text class="st16" transform="translate(2013.7858 489)"><tspan x="0" y="0">about the politics of sensing.</tspan></text>
    <text class="st13" transform="translate(2013.7858 515)"><tspan x="0" y="0">The robot as sensing apparatus.</tspan></text>
    <line class="st20" x1="1263.79" y1="735" x2="1513.79" y2="735"/>
    <polygon class="st18" points="1518.79 735 1506.79 729 1506.79 741 1518.79 735"/>
    <rect class="st14" x="1533.79" y="655" width="350" height="160" rx="10" ry="10"/>
    <text class="st10" transform="translate(1655.7463 705)"><tspan x="0" y="0">WETWARE</tspan></text>
    <text class="st6" transform="translate(1692.224 765)"><tspan x="0" y="0">Ch 09</tspan></text>
    <line class="st22" x1="1883.79" y1="735" x2="1993.79" y2="735"/>
    <text class="st16" transform="translate(2013.7858 712)"><tspan x="0" y="0">What the plant&apos;s response revealed</tspan></text>
    <text class="st16" transform="translate(2013.7858 739)"><tspan x="0" y="0">about biological agency.</tspan></text>
    <text class="st13" transform="translate(2013.7858 765)"><tspan x="0" y="0">The plant as co-author.</tspan></text>
    <line class="st20" x1="1263.79" y1="985" x2="1513.79" y2="985"/>
    <polygon class="st18" points="1518.79 985 1506.79 979 1506.79 991 1518.79 985"/>
    <rect class="st14" x="1533.79" y="905" width="350" height="160" rx="10" ry="10"/>
    <text class="st10" transform="translate(1656.8163 955)"><tspan x="0" y="0">MULTIPLE</tspan></text>
    <text class="st10" transform="translate(1626.2869 980)"><tspan x="0" y="0">INTELLIGENCES</tspan></text>
    <text class="st6" transform="translate(1692.224 1015)"><tspan x="0" y="0">Ch 11</tspan></text>
    <line class="st22" x1="1883.79" y1="985" x2="1993.79" y2="985"/>
    <text class="st16" transform="translate(2013.7858 962)"><tspan x="0" y="0">What the failure revealed about</tspan></text>
    <text class="st16" transform="translate(2013.7858 989)"><tspan x="0" y="0">sustaining co-authorship.</tspan></text>
    <text class="st13" transform="translate(2013.7858 1015)"><tspan x="0" y="0">The coupling as cognitive.</tspan></text>
  </g>
  <g id="layer-closing" inkscape:groupmode="layer" inkscape:label="Closing">
    <text class="st4" transform="translate(1018.1095 1265)"><tspan x="0" y="0">Refraction does not translate the practice into theory.</tspan></text>
    <text class="st4" transform="translate(810.1472 1305)"><tspan x="0" y="0">It re-enters the same work from different angles, producing distance without leaving the medium.</tspan></text>
  </g>
