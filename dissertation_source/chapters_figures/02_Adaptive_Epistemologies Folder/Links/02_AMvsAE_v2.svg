  <g id="layer-am-side" inkscape:groupmode="layer" inkscape:label="AM Side">
    <text class="st10" transform="translate(443.37 418.94)"><tspan x="0" y="0">ADAPTIVE MANAGEMENT</tspan></text>
    <text class="st20" transform="translate(552.15 453.94)"><tspan x="0" y="0">Holling, Walters, 1970s</tspan></text>
    <rect class="st1" x="300" y="488.94" width="660" height="380" rx="10" ry="10"/>
    <text class="st13" transform="translate(592.34 558.94)"><tspan x="0" y="0">Set targets</tspan></text>
    <text class="st13" transform="translate(596.48 588.94)"><tspan x="0" y="0">Intervene</tspan></text>
    <text class="st13" transform="translate(601.46 618.94)"><tspan x="0" y="0">Monitor</tspan></text>
    <text class="st13" transform="translate(583.72 648.94)"><tspan x="0" y="0">Adjust model</tspan></text>
    <line class="st3" x1="400" y1="698.94" x2="860" y2="698.94"/>
    <text class="st16" transform="translate(531.6 748.94)"><tspan x="0" y="0">Goals: predetermined outcomes</tspan></text>
    <text class="st16" transform="translate(547.23 776.94)"><tspan x="0" y="0">Uncertainty: to be reduced</tspan></text>
    <text class="st16" transform="translate(517.99 804.94)"><tspan x="0" y="0">Design: implements prior knowledge</tspan></text>
    <text class="st16" transform="translate(537.8 832.94)"><tspan x="0" y="0">Surprise: error to be corrected</tspan></text>
    <rect class="st6" x="380" y="928.94" width="500" height="100" rx="8" ry="8"/>
    <text class="st19" transform="translate(586.29 968.94)"><tspan x="0" y="0">OUTPUT</tspan></text>
    <text class="st18" transform="translate(564.1386 1003.9442)"><tspan x="0" y="0">A better prediction</tspan></text>
  </g>
  <g id="layer-ae-side" inkscape:groupmode="layer" inkscape:label="AE Side">
    <text class="st8" transform="translate(1726.6626 418.9442)"><tspan x="0" y="0">ADAPTIVE EPISTEMOLOGY</tspan></text>
    <rect class="st2" x="1590" y="488.94" width="660" height="380" rx="10" ry="10"/>
    <text class="st14" transform="translate(1851.3927 558.9442)"><tspan x="0" y="0">Propose hypothesis</tspan></text>
    <text class="st14" transform="translate(1886.48 588.9442)"><tspan x="0" y="0">Intervene</tspan></text>
    <text class="st14" transform="translate(1808.6726 618.9442)"><tspan x="0" y="0">Sense what the territory reveals</tspan></text>
    <text class="st14" transform="translate(1851.3085 648.9442)"><tspan x="0" y="0">Revise the question</tspan></text>
    <line class="st4" x1="1690" y1="698.94" x2="2150" y2="698.94"/>
    <text class="st15" transform="translate(1830.0724 748.9442)"><tspan x="0" y="0">Goals: emergent from inquiry</tspan></text>
    <text class="st15" transform="translate(1799.7614 776.9442)"><tspan x="0" y="0">Uncertainty: the medium of knowledge</tspan></text>
    <text class="st15" transform="translate(1815.6014 804.9442)"><tspan x="0" y="0">Design: generates new knowledge</tspan></text>
    <text class="st15" transform="translate(1797.767 832.9442)"><tspan x="0" y="0">Surprise: information the model needed</tspan></text>
    <rect class="st5" x="1670" y="928.94" width="500" height="100" rx="8" ry="8"/>
    <text class="st12" transform="translate(1876.2906 968.9442)"><tspan x="0" y="0">OUTPUT</tspan></text>
    <text class="st17" transform="translate(1738.8506 1003.9442)"><tspan x="0" y="0">Knowledge that prediction could not have specified</tspan></text>
  </g>
  <g id="layer-closing" inkscape:groupmode="layer" inkscape:label="Closing">
    <line class="st7" x1="500" y1="1128.94" x2="2050" y2="1128.94"/>
    <text class="st9" transform="translate(956.7839 1198.9442)"><tspan x="0" y="0">Both iterate. Both learn. Rather than closing toward confirmation.</tspan></text>
    <text class="st9" transform="translate(1032.0033 1238.9442)"><tspan x="0" y="0">we open into questions the last cycle could not ask.</tspan></text>
