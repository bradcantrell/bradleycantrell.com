  <g id="layer-static-labels" inkscape:groupmode="layer" inkscape:label="Static Labels">
    <text class="st0" transform="translate(534.08 384.39)"><tspan x="0" y="0">STATIC</tspan></text>
    <text class="st10" transform="translate(507.38 504.39)"><tspan x="0" y="0">Survey and inventory</tspan></text>
    <text class="st10" transform="translate(515.26 654.39)"><tspan x="0" y="0">Predict future state</tspan></text>
    <text class="st10" transform="translate(513.16 804.39)"><tspan x="0" y="0">Specify fixed design</tspan></text>
    <text class="st10" transform="translate(515.01 954.39)"><tspan x="0" y="0">Build and construct</tspan></text>
    <text class="st7" transform="translate(502.6912 1099.3877)"><tspan x="0" y="0">Maintain in perpetuity</tspan></text>
    <text class="st5" transform="translate(535.0023 1244.3877)"><tspan x="0" y="0">Assumes stationarity</tspan></text>
    <text class="st5" transform="translate(516.7587 1266.3877)"><tspan x="0" y="0">No mechanism for learning</tspan></text>
  </g>
  <g id="layer-adaptive-labels" inkscape:groupmode="layer" inkscape:label="Adaptive Labels">
    <text class="st0" transform="translate(1856.6412 384.3877)"><tspan x="0" y="0">ADAPTIVE</tspan></text>
    <text class="st10" transform="translate(1867.1661 492.3877)"><tspan x="0" y="0">Design proposition</tspan></text>
    <text class="st12" transform="translate(1905.4207 514.3877)"><tspan x="0" y="0">as hypothesis</tspan></text>
    <text class="st10" transform="translate(1847.1156 654.3877)"><tspan x="0" y="0">Implement and observe</tspan></text>
    <text class="st10" transform="translate(1868.1207 804.3877)"><tspan x="0" y="0">Sense and monitor</tspan></text>
    <text class="st10" transform="translate(1870.1202 949.3877)"><tspan x="0" y="0">Interpret what the</tspan></text>
    <text class="st10" transform="translate(1873.4054 972.3877)"><tspan x="0" y="0">landscape reveals</tspan></text>
    <text class="st10" transform="translate(1873.9905 1104.3877)"><tspan x="0" y="0">Revise and adjust</tspan></text>
  </g>
  <g id="layer-feedback-label" inkscape:groupmode="layer" inkscape:label="Feedback Label">
    <text class="st6" transform="translate(2238.4727 814.3877) rotate(90)"><tspan x="0" y="0">Territory responds. Knowledge accumulates.</tspan></text>
  </g>
