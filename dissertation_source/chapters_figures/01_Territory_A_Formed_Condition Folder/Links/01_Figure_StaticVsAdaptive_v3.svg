    <text class="st8" transform="translate(1899.6215 1244.3253)"><tspan x="0" y="0">Learn and adjust</tspan></text>
    <text class="st8" transform="translate(1782.803 1266.3253)"><tspan x="0" y="0">Each cycle produces aggregating knowledge</tspan></text>
  </g>
