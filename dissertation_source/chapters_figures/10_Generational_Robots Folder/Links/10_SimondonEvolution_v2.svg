    <text class="st4" transform="translate(217 249.51)"><tspan x="0" y="0">Abstract to Applied</tspan></text>
    <text class="st1" transform="translate(220 283.51)"><tspan x="0" y="0">From abstract assemblage to technical object. After Simondon (1958).</tspan></text>
  </g>
  <g id="layer-stages" inkscape:groupmode="layer" inkscape:label="Stages">
    <rect class="st6" x="244" y="411.51" width="320" height="520" rx="10" ry="10"/>
    <text class="st15" transform="translate(324.92 501.51)"><tspan x="0" y="0">SEDIMACHINE</tspan></text>
    <text class="st3" transform="translate(387.76 531.51)"><tspan x="0" y="0">2012</tspan></text>
    <line class="st17" x1="274" y1="561.51" x2="534" y2="561.51"/>
    <text class="st2" transform="translate(334.58 606.51)"><tspan x="0" y="0">Abstract assemblage.</tspan></text>
    <text class="st2" transform="translate(304.7 636.51)"><tspan x="0" y="0">Separate components brought</tspan></text>
    <text class="st2" transform="translate(340.11 661.51)"><tspan x="0" y="0">together externally.</tspan></text>
    <line class="st19" x1="569" y1="671.51" x2="619" y2="671.51"/>
    <polygon class="st13" points="624 671.51 612 665.51 612 677.51 624 671.51"/>
    <rect class="st10" x="644" y="411.51" width="320" height="520" rx="10" ry="10"/>
    <text class="st15" transform="translate(693.67 501.51)"><tspan x="0" y="0">DREDGEFEST TABLE</tspan></text>
    <text class="st3" transform="translate(787.76 531.51)"><tspan x="0" y="0">2014</tspan></text>
    <line class="st17" x1="674" y1="561.51" x2="934" y2="561.51"/>
    <text class="st2" transform="translate(740.35 606.51)"><tspan x="0" y="0">Partially integrated.</tspan></text>
    <text class="st2" transform="translate(701.66 636.51)"><tspan x="0" y="0">Water, sediment, sensors begin</tspan></text>
    <text class="st2" transform="translate(755.92 661.51)"><tspan x="0" y="0">to co-produce.</tspan></text>
    <line class="st19" x1="969" y1="671.51" x2="1019" y2="671.51"/>
    <polygon class="st13" points="1024 671.51 1012 665.51 1012 677.51 1024 671.51"/>
    <rect class="st5" x="1044" y="411.51" width="320" height="520" rx="10" ry="10"/>
    <text class="st15" transform="translate(1140.2208 501.5054)"><tspan x="0" y="0">ALGO CULT</tspan></text>
    <text class="st3" transform="translate(1189.6708 531.5054)"><tspan x="0" y="0">2019</tspan></text>
    <line class="st17" x1="1074" y1="561.51" x2="1334" y2="561.51"/>
    <text class="st2" transform="translate(1149.7593 606.5054)"><tspan x="0" y="0">Coupled system.</tspan></text>
    <text class="st2" transform="translate(1137.2571 636.5054)"><tspan x="0" y="0">Robot, plant, data as</tspan></text>
    <text class="st2" transform="translate(1149.7521 661.5054)"><tspan x="0" y="0">single operation.</tspan></text>
    <line class="st19" x1="1369" y1="671.51" x2="1419" y2="671.51"/>
    <polygon class="st13" points="1424 671.51 1412 665.51 1412 677.51 1424 671.51"/>
    <rect class="st14" x="1444" y="411.51" width="320" height="520" rx="10" ry="10"/>
    <text class="st16" transform="translate(1471.9087 501.5054)"><tspan x="0" y="0">GEOMORPHOLOGY LABS</tspan></text>
    <text class="st3" transform="translate(1550.0983 531.5054)"><tspan x="0" y="0">LAB 2013-present</tspan></text>
    <line class="st17" x1="1474" y1="561.51" x2="1734" y2="561.51"/>
    <text class="st2" transform="translate(1536.1694 606.5054)"><tspan x="0" y="0">Hybrid environment.</tspan></text>
    <text class="st2" transform="translate(1514.7197 636.5054)"><tspan x="0" y="0">Physical-digital system that</tspan></text>
    <text class="st2" transform="translate(1517.3748 661.5054)"><tspan x="0" y="0">computes in two registers.</tspan></text>
    <line class="st19" x1="1769" y1="671.51" x2="1819" y2="671.51"/>
    <polygon class="st13" points="1824 671.51 1812 665.51 1812 677.51 1824 671.51"/>
