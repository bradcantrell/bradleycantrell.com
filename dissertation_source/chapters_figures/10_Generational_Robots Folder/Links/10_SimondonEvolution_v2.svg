    <text class="st15" transform="translate(1940.6045 501.5054)"><tspan x="0" y="0">NEOM IOE</tspan></text>
    <text class="st3" transform="translate(1954.0818 531.5054)"><tspan x="0" y="0" xml:space="preserve"> 2022–2025</tspan></text>
    <line class="st17" x1="1874" y1="561.51" x2="2134" y2="561.51"/>
    <text class="st2" transform="translate(1940.7972 606.5054)"><tspan x="0" y="0">Territorial coupling.</tspan></text>
    <text class="st2" transform="translate(1917.5138 636.5054)"><tspan x="0" y="0">Sensing, biological agency,</tspan></text>
    <text class="st2" transform="translate(1905.8285 661.5054)"><tspan x="0" y="0">infrastructure as one medium.</tspan></text>
