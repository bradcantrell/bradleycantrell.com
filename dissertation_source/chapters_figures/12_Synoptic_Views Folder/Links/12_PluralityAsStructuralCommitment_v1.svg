  <g id="layer-header" inkscape:groupmode="layer" inkscape:label="Header">
    <text class="st4" transform="translate(213.8 247.39)"><tspan x="0" y="0">PLURALITY AS STRUCTURAL COMMITMENT</tspan></text>
    <text class="st2" transform="translate(215.17 281.39)"><tspan x="0" y="0">The four design decisions where plurality operates as constraint</tspan></text>
  </g>
  <g id="layer-distinction" inkscape:groupmode="layer" inkscape:label="Distinction Strip">
    <g>
      <text class="st7" transform="translate(1779.1167 349.1075)"><tspan x="0" y="0">PLURALITY</tspan></text>
      <text class="st6" transform="translate(1681.0693 391.1075)"><tspan x="0" y="0">A commitment that reshapes what the design is.</tspan></text>
    </g>
  </g>
  <g id="layer-cells" inkscape:groupmode="layer" inkscape:label="Decision Cells">
    <g id="cell-01">
      <rect class="st9" x="248.56" y="436.83" width="922.87" height="359.07" rx="12" ry="12"/>
      <text class="st1" transform="translate(551.2 526.83)"><tspan x="0" y="0">WHAT TO PROTOTYPE</tspan></text>
      <text class="st5" transform="translate(603.03 579.83)"><tspan x="0" y="0">Which propositions get built.</tspan></text>
      <line class="st3" x1="560" y1="602.7" x2="860" y2="602.7"/>
      <text class="st0" transform="translate(566.09 643.83)"><tspan x="0" y="0">Prototyping sets the trajectory of what</tspan></text>
      <text class="st0" transform="translate(574 675.83)"><tspan x="0" y="0">can be learned. Propositions that are</tspan></text>
      <text class="st0" transform="translate(562.77 707.83)"><tspan x="0" y="0">never built foreclose the questions they</tspan></text>
      <text class="st0" transform="translate(635.01 739.83)"><tspan x="0" y="0">would have opened.</tspan></text>
    </g>
    <g id="cell-02">
      <rect class="st9" x="1378.56" y="436.83" width="922.87" height="359.07" rx="12" ry="12"/>
      <text class="st1" transform="translate(1723.2554 526.829)"><tspan x="0" y="0">WHERE TO TEST</tspan></text>
      <text class="st5" transform="translate(1689.1669 579.829)"><tspan x="0" y="0">Which territories absorb the experiment.</tspan></text>
      <line class="st3" x1="1690" y1="602.7" x2="1990" y2="602.7"/>
      <text class="st0" transform="translate(1688.0972 643.829)"><tspan x="0" y="0">Testing concentrates burden and benefit.</tspan></text>
      <text class="st0" transform="translate(1702.5092 675.829)"><tspan x="0" y="0">Where the prototype sits determines</tspan></text>
      <text class="st0" transform="translate(1691.0046 707.829)"><tspan x="0" y="0">whose environment becomes the site of</tspan></text>
      <text class="st0" transform="translate(1701.8169 739.829)"><tspan x="0" y="0">inquiry and whose remains outside it.</tspan></text>
    </g>
    <g id="cell-03">
      <rect class="st9" x="248.56" y="827.47" width="922.87" height="355.09" rx="12" ry="12"/>
      <text class="st1" transform="translate(458.03 917.47)"><tspan x="0" y="0">WHOSE VOICES DRIVE THE SYSTEM</tspan></text>
      <text class="st5" transform="translate(572.75 970.47)"><tspan x="0" y="0">Whose readings revise the trajectory.</tspan></text>
      <line class="st3" x1="560" y1="993.34" x2="860" y2="993.34"/>
      <text class="st0" transform="translate(571.4976 1036.3652)"><tspan x="0" y="0">When monitoring reveals divergence,</tspan></text>
      <text class="st0" transform="translate(574.0139 1068.3652)"><tspan x="0" y="0">whose account is taken as signal and</tspan></text>
      <text class="st0" transform="translate(569.8658 1100.3652)"><tspan x="0" y="0">whose as noise shapes what the work</tspan></text>
      <text class="st0" transform="translate(671.6143 1132.3653)"><tspan x="0" y="0">does next.</tspan></text>
    </g>
    <g id="cell-04">
      <rect class="st9" x="1378.56" y="827.47" width="922.87" height="356.02" rx="12" ry="12"/>
      <text class="st1" transform="translate(1676.6918 917.4672)"><tspan x="0" y="0">WHO BEARS THE COST</tspan></text>
      <text class="st5" transform="translate(1698.5579 970.4672)"><tspan x="0" y="0">Whose communities carry the burden.</tspan></text>
      <line class="st3" x1="1690" y1="992.97" x2="1990" y2="992.97"/>
      <text class="st0" transform="translate(1688.3914 1036.3649)"><tspan x="0" y="0">Disproportionate burden is not an equity</tspan></text>
      <text class="st0" transform="translate(1683.8141 1068.3649)"><tspan x="0" y="0">footnote appended to a technical process.</tspan></text>
      <text class="st0" transform="translate(1699.0244 1100.3649)"><tspan x="0" y="0">It is evidence the hypothesis is wrong.</tspan></text>
    </g>
  </g>
</svg>