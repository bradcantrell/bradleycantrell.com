<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagram Viewer — Venice Lagoon Studio</title>
<style>
:root{--red:#E61C1C;--bg:#0a0a0f;--card-bg:#12141a;--border:#222}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto','Helvetica Neue',sans-serif;background:var(--bg);color:#ddd;overflow:hidden;height:100vh}

/* Top bar */
.toolbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.95);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;font-size:8pt;text-transform:uppercase;letter-spacing:.05em;backdrop-filter:blur(10px)}
.toolbar a{color:#888;text-decoration:none;padding:4px 8px;border:1px solid transparent}
.toolbar a:hover,.toolbar a.active{color:var(--red);border-color:var(--red)}
.toolbar .title{color:var(--red);font-weight:700;font-size:9pt;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .btn{background:var(--card-bg);border:1px solid var(--border);color:#aaa;padding:4px 10px;cursor:pointer;font-size:7pt;text-transform:uppercase;letter-spacing:.04em}
.toolbar .btn:hover{color:#fff;border-color:#888}
.toolbar .zoom-level{color:var(--red);font-size:7pt;min-width:40px;text-align:center}

/* Viewport */
.viewport{position:absolute;top:40px;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle at center,#1a1a24 1px,transparent 1px);background-size:24px 24px;cursor:grab}
.viewport:active{cursor:grabbing}
.viewport.dragging{cursor:grabbing}

/* SVG wrapper */
.svg-wrap{position:absolute;transform-origin:0 0;pointer-events:none}
.svg-wrap svg{display:block;pointer-events:all;max-width:none}
.svg-wrap svg *{pointer-events:all}

/* Loading / Error states */
.state-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#555;font-size:10pt}
.state-msg .icon{font-size:32px;margin-bottom:8px}
.loading{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#333}

@media(max-width:768px){
  .toolbar{padding:6px 10px;gap:6px;font-size:7pt}
  .toolbar .btn{padding:3px 6px;font-size:6pt}
}
</style>
</head>
<body>

<div class="toolbar">
  <a href="research.html">← Compendium</a>
  <span class="title" id="diagramTitle">Loading…</span>
  <button class="btn" onclick="zoomTo('fit')" title="Fit to screen">⌂ Fit</button>
  <button class="btn" onclick="zoomTo('in')" title="Zoom in">+</button>
  <span class="zoom-level" id="zoomLevel">100%</span>
  <button class="btn" onclick="zoomTo('out')" title="Zoom out">−</button>
  <button class="btn" onclick="zoomTo('1')" title="Reset to 100%">1:1</button>
  <a href="#" id="downloadLink" download style="color:var(--red);border-color:var(--red)">↓ SVG</a>
</div>

<div class="viewport" id="viewport">
  <div class="state-msg loading" id="loadingMsg">
    <div class="icon">◈</div>
    Loading diagram…
  </div>
  <div class="svg-wrap" id="svgWrap"></div>
</div>

<script>
// ── State ──
let scale = 1, tx = 0, ty = 0;
let panning = false, px = 0, py = 0;
const viewport = document.getElementById('viewport');
const svgWrap = document.getElementById('svgWrap');
const zoomLevel = document.getElementById('zoomLevel');
const diagramTitle = document.getElementById('diagramTitle');
const loadingMsg = document.getElementById('loadingMsg');
const downloadLink = document.getElementById('downloadLink');

// ── Load SVG from query param ──
const params = new URLSearchParams(window.location.search);
const src = params.get('src');
const title = params.get('title') || (src ? src.split('/').pop().replace(/\.svg$/i,'').replace(/[-_]/g,' ') : 'Diagram');

diagramTitle.textContent = title;
document.title = title + ' — Venice Lagoon Studio';

if (!src) {
  loadingMsg.innerHTML = '<div class="icon">⚠</div>No diagram specified.<br><small>Add ?src=diagram.svg to the URL</small>';
  loadingMsg.classList.remove('loading');
} else {
  downloadLink.href = src;
  loadSVG(src);
}

function loadSVG(url) {
  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(svgText => {
      loadingMsg.style.display = 'none';
      // Extract inner SVG content
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, 'image/svg+xml');
      const svgEl = doc.querySelector('svg');
      if (!svgEl) throw new Error('No SVG element found');
      
      // Set viewBox if missing
      if (!svgEl.getAttribute('viewBox')) {
        const w = svgEl.getAttribute('width') || '800';
        const h = svgEl.getAttribute('height') || '600';
        svgEl.setAttribute('viewBox', `0 0 ${parseFloat(w)} ${parseFloat(h)}`);
      }
      svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svgEl.style.width = '100%';
      svgEl.style.height = '100%';
      
      svgWrap.innerHTML = '';
      svgWrap.appendChild(svgEl);
      
      // Fit to screen
      requestAnimationFrame(() => zoomTo('fit'));
    })
    .catch(err => {
      loadingMsg.innerHTML = `<div class="icon">⚠</div>Failed to load<br><small>${err.message}</small>`;
      loadingMsg.classList.remove('loading');
    });
}

// ── Apply transform ──
function applyTransform() {
  svgWrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  zoomLevel.textContent = Math.round(scale * 100) + '%';
}

// ── Zoom ──
function zoomTo(action) {
  const svg = svgWrap.querySelector('svg');
  if (!svg) return;
  
  const vb = svg.getAttribute('viewBox');
  if (!vb) return;
  const [, , vbW, vbH] = vb.split(' ').map(Number);
  const vpW = viewport.clientWidth;
  const vpH = viewport.clientHeight;
  
  if (action === 'fit') {
    scale = Math.min(vpW / vbW, vpH / vbH, 1.5);
    tx = (vpW - vbW * scale) / 2;
    ty = (vpH - vbH * scale) / 2;
  } else if (action === 'in') {
    const cx = viewport.clientWidth / 2;
    const cy = viewport.clientHeight / 2;
    const oldScale = scale;
    scale = Math.min(scale * 1.4, 10);
    tx = cx - (cx - tx) * (scale / oldScale);
    ty = cy - (cy - ty) * (scale / oldScale);
  } else if (action === 'out') {
    const cx = viewport.clientWidth / 2;
    const cy = viewport.clientHeight / 2;
    const oldScale = scale;
    scale = Math.max(scale / 1.4, 0.05);
    tx = cx - (cx - tx) * (scale / oldScale);
    ty = cy - (cy - ty) * (scale / oldScale);
  } else if (action === '1') {
    tx = (viewport.clientWidth - vbW) / 2;
    ty = (viewport.clientHeight - vbH) / 2;
    scale = 1;
  }
  applyTransform();
}

// ── Mouse wheel zoom ──
viewport.addEventListener('wheel', function(e) {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const oldScale = scale;
  scale *= e.deltaY < 0 ? 1.08 : 0.93;
  scale = Math.max(0.05, Math.min(10, scale));
  tx = mx - (mx - tx) * (scale / oldScale);
  ty = my - (my - ty) * (scale / oldScale);
  applyTransform();
}, {passive: false});

// ── Pan (drag) ──
viewport.addEventListener('mousedown', function(e) {
  if (e.target.closest('button') || e.target.closest('a')) return;
  panning = true;
  px = e.clientX - tx;
  py = e.clientY - ty;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', function(e) {
  if (!panning) return;
  tx = e.clientX - px;
  ty = e.clientY - py;
  applyTransform();
});
window.addEventListener('mouseup', function() {
  panning = false;
  viewport.classList.remove('dragging');
});

// ── Touch ──
let lastDist = 0;
viewport.addEventListener('touchstart', function(e) {
  if (e.touches.length === 2) {
    lastDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  } else if (e.touches.length === 1) {
    panning = true;
    px = e.touches[0].clientX - tx;
    py = e.touches[0].clientY - ty;
  }
}, {passive: false});
viewport.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = viewport.getBoundingClientRect();
    const mx = cx - rect.left, my = cy - rect.top;
    const oldScale = scale;
    scale *= dist / lastDist;
    scale = Math.max(0.05, Math.min(10, scale));
    tx = mx - (mx - tx) * (scale / oldScale);
    ty = my - (my - ty) * (scale / oldScale);
    lastDist = dist;
    applyTransform();
  } else if (panning && e.touches.length === 1) {
    tx = e.touches[0].clientX - px;
    ty = e.touches[0].clientY - py;
    applyTransform();
  }
}, {passive: false});
viewport.addEventListener('touchend', function() { panning = false; });

// ── Keyboard ──
window.addEventListener('keydown', function(e) {
  switch(e.key) {
    case '0': zoomTo('fit'); break;
    case '1': zoomTo('1'); break;
    case '+': case '=': zoomTo('in'); break;
    case '-': zoomTo('out'); break;
    case 'f': zoomTo('fit'); break;
  }
});
</script>
</body>
</html>
