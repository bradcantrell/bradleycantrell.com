<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Roboto, Helvetica, Arial, sans-serif">
  <!-- Drawing Scales: the same building at four metric scales -->

  <!-- A simple gable pavilion shape, drawn at decreasing sizes.
       Full-size building is 12 m wide x 6 m tall (gable apex).
       At scale the drawn size = 12000/scale mm, 6000/scale mm. -->

  <!-- 1:50  -> width 240, height 120 -->
  <g transform="translate(30, 60)">
    <path d="M0 120 L0 60 L120 0 L240 60 L240 120 Z" fill="none" stroke="#121212" stroke-width="2"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#121212" stroke-width="2"/>
    <rect x="100" y="60" width="40" height="60" fill="none" stroke="#9B1B1B" stroke-width="1.5"/>
    <text x="120" y="152" text-anchor="middle" font-size="13" fill="#9B1B1B" font-weight="700">1:50</text>
  </g>

  <!-- 1:100 -> width 120, height 60 -->
  <g transform="translate(330, 120)">
    <path d="M0 60 L0 30 L60 0 L120 30 L120 60 Z" fill="none" stroke="#121212" stroke-width="2"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#121212" stroke-width="2"/>
    <rect x="50" y="30" width="20" height="30" fill="none" stroke="#9B1B1B" stroke-width="1.5"/>
    <text x="60" y="92" text-anchor="middle" font-size="13" fill="#9B1B1B" font-weight="700">1:100</text>
  </g>

  <!-- 1:200 -> width 60, height 30 -->
  <g transform="translate(590, 150)">
    <path d="M0 30 L0 15 L30 0 L60 15 L60 30 Z" fill="none" stroke="#121212" stroke-width="2"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#121212" stroke-width="2"/>
    <text x="30" y="62" text-anchor="middle" font-size="13" fill="#9B1B1B" font-weight="700">1:200</text>
  </g>

  <!-- 1:500 -> width 24, height 12 -->
  <g transform="translate(810, 168)">
    <path d="M0 12 L0 6 L12 0 L24 6 L24 12 Z" fill="none" stroke="#121212" stroke-width="2"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#121212" stroke-width="2"/>
    <text x="12" y="36" text-anchor="middle" font-size="13" fill="#9B1B1B" font-weight="700">1:500</text>
  </g>

  <!-- Scale bars: each represents 10 m, rendered at correct paper length -->
  <!-- 1:50  10m=200px;  1:100 10m=100px; 1:200 10m=50px; 1:500 10m=20px -->
  <g font-size="10" fill="#555">
    <!-- 1:50 -->
    <g stroke="#121212" stroke-width="1.5">
      <line x1="30" y1="300" x2="230" y2="300"/>
      <line x1="30" y1="294" x2="30" y2="306"/>
      <line x1="230" y1="294" x2="230" y2="306"/>
    </g>
    <text x="130" y="322" text-anchor="middle">10 m</text>

    <!-- 1:100 -->
    <g stroke="#121212" stroke-width="1.5">
      <line x1="340" y1="300" x2="440" y2="300"/>
      <line x1="340" y1="294" x2="340" y2="306"/>
      <line x1="440" y1="294" x2="440" y2="306"/>
    </g>
    <text x="390" y="322" text-anchor="middle">10 m</text>

    <!-- 1:200 -->
    <g stroke="#121212" stroke-width="1.5">
      <line x1="595" y1="300" x2="645" y2="300"/>
      <line x1="595" y1="294" x2="595" y2="306"/>
      <line x1="645" y1="294" x2="645" y2="306"/>
    </g>
    <text x="620" y="322" text-anchor="middle">10 m</text>

    <!-- 1:500 -->
    <g stroke="#121212" stroke-width="1.5">
      <line x1="800" y1="300" x2="820" y2="300"/>
      <line x1="800" y1="294" x2="800" y2="306"/>
      <line x1="820" y1="294" x2="820" y2="306"/>
    </g>
    <text x="810" y="322" text-anchor="middle">10 m</text>
  </g>

  <text x="450" y="350" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Same building, same 10 m scale bar — detail drops out as the ratio grows.</text>
</svg>
