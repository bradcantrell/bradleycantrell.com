<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Roboto, Helvetica, Arial, sans-serif">
  <!-- Why Metric: imperial's arbitrary factors vs metric's powers of ten -->

  <!-- Imperial row -->
  <text x="24" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#555" font-family="Roboto, Arial, sans-serif">IMPERIAL</text>

  <g fill="none" stroke="#999" stroke-width="1.5">
    <rect x="24" y="58" width="90" height="44" rx="4"/>
    <rect x="250" y="58" width="90" height="44" rx="4"/>
    <rect x="478" y="58" width="90" height="44" rx="4"/>
    <rect x="646" y="58" width="90" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#555" font-weight="600">
    <text x="69" y="85">inch</text>
    <text x="295" y="85">foot</text>
    <text x="523" y="85">yard</text>
    <text x="691" y="85">mile</text>
  </g>
  <!-- imperial factors -->
  <g fill="none" stroke="#999" stroke-width="1.5">
    <line x1="116" y1="80" x2="248" y2="80"/>
    <line x1="342" y1="80" x2="476" y2="80"/>
    <line x1="570" y1="80" x2="644" y2="80"/>
    <path d="M248 80 l-7 -4 v8 z" fill="#999" stroke="none"/>
    <path d="M476 80 l-7 -4 v8 z" fill="#999" stroke="none"/>
    <path d="M644 80 l-7 -4 v8 z" fill="#999" stroke="none"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#555" font-weight="700">
    <text x="182" y="70">× 12</text>
    <text x="409" y="70">× 3</text>
    <text x="607" y="70">× 1760</text>
  </g>

  <!-- Metric row -->
  <text x="24" y="205" font-size="13" font-weight="700" letter-spacing="2" fill="#9B1B1B" font-family="Roboto, Arial, sans-serif">METRIC</text>

  <g fill="none" stroke="#9B1B1B" stroke-width="2">
    <rect x="24" y="223" width="90" height="48" rx="4"/>
    <rect x="250" y="223" width="90" height="48" rx="4"/>
    <rect x="478" y="223" width="90" height="48" rx="4"/>
    <rect x="646" y="223" width="90" height="48" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#9B1B1B" font-weight="600">
    <text x="69" y="253">mm</text>
    <text x="295" y="253">cm</text>
    <text x="523" y="253">m</text>
    <text x="691" y="253">km</text>
  </g>
  <g fill="none" stroke="#9B1B1B" stroke-width="2">
    <line x1="116" y1="247" x2="248" y2="247"/>
    <line x1="342" y1="247" x2="476" y2="247"/>
    <line x1="570" y1="247" x2="644" y2="247"/>
    <path d="M248 247 l-7 -4 v8 z" fill="#9B1B1B" stroke="none"/>
    <path d="M476 247 l-7 -4 v8 z" fill="#9B1B1B" stroke="none"/>
    <path d="M644 247 l-7 -4 v8 z" fill="#9B1B1B" stroke="none"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#9B1B1B" font-weight="700">
    <text x="182" y="237">× 10</text>
    <text x="409" y="237">× 100</text>
    <text x="607" y="237">× 1000</text>
  </g>

  <text x="380" y="312" text-anchor="middle" font-size="11" fill="#555" font-style="italic">One base unit, powers of ten, no fractions.</text>
</svg>
