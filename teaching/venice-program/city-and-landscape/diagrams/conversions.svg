<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Roboto, Helvetica, Arial, sans-serif">
  <!-- Six Conversions: aligned imperial and metric rulers -->

  <!-- Imperial ruler (top) -->
  <rect x="60" y="60" width="640" height="46" fill="#FAFAFA" stroke="#999" stroke-width="1.5"/>
  <g stroke="#555" stroke-width="1">
    <!-- inch ticks -->
    <line x1="60" y1="106" x2="60" y2="60"/>
    <line x1="273" y1="106" x2="273" y2="60"/>
    <line x1="486" y1="106" x2="486" y2="60"/>
    <line x1="699" y1="106" x2="699" y2="60"/>
    <!-- half-inch ticks -->
    <line x1="166" y1="106" x2="166" y2="80"/>
    <line x1="379" y1="106" x2="379" y2="80"/>
    <line x1="592" y1="106" x2="592" y2="80"/>
  </g>
  <g font-size="12" fill="#555" font-weight="600">
    <text x="60" y="52" text-anchor="middle">0</text>
    <text x="273" y="52" text-anchor="middle">1 in</text>
    <text x="486" y="52" text-anchor="middle">2 in</text>
    <text x="699" y="52" text-anchor="middle">3 in</text>
  </g>

  <!-- Metric ruler (bottom) -->
  <rect x="60" y="170" width="640" height="46" fill="#FAFAFA" stroke="#9B1B1B" stroke-width="1.5"/>
  <g stroke="#9B1B1B" stroke-width="1">
    <line x1="60" y1="170" x2="60" y2="216"/>
    <line x1="274" y1="170" x2="274" y2="216"/>
    <line x1="487" y1="170" x2="487" y2="216"/>
    <line x1="700" y1="170" x2="700" y2="216"/>
    <!-- cm ticks every 10 mm (1 mm = 8.386 px) -->
    <line x1="144" y1="170" x2="144" y2="190"/>
    <line x1="228" y1="170" x2="228" y2="190"/>
    <line x1="312" y1="170" x2="312" y2="190"/>
    <line x1="396" y1="170" x2="396" y2="190"/>
    <line x1="480" y1="170" x2="480" y2="190"/>
    <line x1="564" y1="170" x2="564" y2="190"/>
    <line x1="648" y1="170" x2="648" y2="190"/>
  </g>
  <g font-size="12" fill="#9B1B1B" font-weight="700">
    <text x="60" y="236" text-anchor="middle">0</text>
    <text x="274" y="236" text-anchor="middle">25.4 mm</text>
    <text x="487" y="236" text-anchor="middle">50.8 mm</text>
    <text x="700" y="236" text-anchor="middle">76.2 mm</text>
  </g>

  <!-- Alignment lines -->
  <g stroke="#CCC" stroke-width="1" stroke-dasharray="4 3">
    <line x1="60" y1="106" x2="60" y2="170"/>
    <line x1="273" y1="106" x2="274" y2="170"/>
    <line x1="486" y1="106" x2="487" y2="170"/>
    <line x1="699" y1="106" x2="700" y2="170"/>
  </g>

  <text x="380" y="140" text-anchor="middle" font-size="13" fill="#9B1B1B" font-weight="700">1 inch = 25.4 mm</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#555" font-style="italic">1 foot = 304.8 mm &#160;&#183;&#160; 1 yard = 914.4 mm &#160;&#183;&#160; 1 m = 3.28 ft</text>
</svg>
