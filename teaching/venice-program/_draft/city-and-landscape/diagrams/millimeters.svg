<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Roboto, Helvetica, Arial, sans-serif">
  <!-- One Rule: Millimeters — the same wall dimension in three units -->

  <!-- Wall (thick horizontal bar) -->
  <rect x="60" y="150" width="640" height="26" rx="2" fill="#FAFAFA" stroke="#121212" stroke-width="2"/>

  <!-- Dimension line above the wall -->
  <g stroke="#9B1B1B" stroke-width="1.5">
    <line x1="60" y1="120" x2="700" y2="120"/>
    <line x1="60" y1="112" x2="60" y2="128"/>
    <line x1="700" y1="112" x2="700" y2="128"/>
    <!-- diagonal extension ticks -->
    <line x1="60" y1="128" x2="60" y2="148" stroke="#CCC" stroke-width="1"/>
    <line x1="700" y1="128" x2="700" y2="148" stroke="#CCC" stroke-width="1"/>
  </g>

  <!-- Primary: 2400 mm -->
  <text x="380" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#9B1B1B">2400 mm</text>

  <!-- Equivalent expressions below -->
  <text x="380" y="196" text-anchor="middle" font-size="13" fill="#555">= 240 cm &#160;&#160;&#160;= 2.4 m</text>

  <!-- Annotations -->
  <text x="60" y="210" font-size="10" fill="#999">wall length</text>
  <text x="700" y="210" text-anchor="end" font-size="10" fill="#999">draw in millimeters — always</text>
</svg>
