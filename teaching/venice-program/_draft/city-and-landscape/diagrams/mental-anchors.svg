<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="Roboto, Helvetica, Arial, sans-serif">
  <!-- Mental Anchors: door elevation + scale figure. Scale: 150 px = 1 m.
       Floor at y=470. Header/ceiling 2.4 m -> y=110. Person 1.8 m -> top y=200.
       Doorknob 1.0 m -> y=320. -->

  <!-- Door frame -->
  <g fill="none" stroke="#121212" stroke-width="2">
    <line x1="150" y1="110" x2="150" y2="470"/>
    <line x1="290" y1="110" x2="290" y2="470"/>
    <line x1="150" y1="110" x2="290" y2="110"/>
  </g>
  <!-- door leaf -->
  <g fill="none" stroke="#555" stroke-width="1">
    <rect x="158" y="118" width="124" height="344" rx="2"/>
    <line x1="282" y1="118" x2="282" y2="462"/>
  </g>
  <!-- doorknob at 1.0 m -->
  <circle cx="270" cy="320" r="5" fill="#9B1B1B"/>

  <!-- Person figure, 1.8 m tall, feet on floor -->
  <g fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round">
    <circle cx="372" cy="214" r="14" fill="#FAFAFA"/>
    <line x1="372" y1="228" x2="372" y2="340"/>
    <line x1="372" y1="246" x2="350" y2="300"/>
    <line x1="372" y1="246" x2="394" y2="300"/>
    <line x1="372" y1="340" x2="354" y2="470"/>
    <line x1="372" y1="340" x2="390" y2="470"/>
  </g>
  <line x1="344" y1="470" x2="400" y2="470" stroke="#121212" stroke-width="1"/>

  <!-- Vertical dimension line -->
  <g stroke="#9B1B1B" stroke-width="1">
    <line x1="90" y1="110" x2="90" y2="470"/>
  </g>
  <g stroke="#9B1B1B" stroke-width="1.5">
    <line x1="80" y1="110" x2="100" y2="110"/>
    <line x1="80" y1="200" x2="100" y2="200"/>
    <line x1="80" y1="320" x2="100" y2="320"/>
    <line x1="80" y1="470" x2="100" y2="470"/>
  </g>
  <g font-size="12" fill="#9B1B1B" font-weight="600">
    <text x="56" y="114" text-anchor="end">2.4 m</text>
    <text x="56" y="204" text-anchor="end">1.8 m</text>
    <text x="56" y="324" text-anchor="end">1.0 m</text>
    <text x="56" y="474" text-anchor="end">0</text>
  </g>
  <!-- reference dashed lines -->
  <line x1="100" y1="110" x2="290" y2="110" stroke="#CCC" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100" y1="200" x2="344" y2="200" stroke="#CCC" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100" y1="320" x2="290" y2="320" stroke="#CCC" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 300 mm tread note -->
  <g stroke="#121212" stroke-width="1.5">
    <line x1="330" y1="500" x2="470" y2="500"/>
    <line x1="330" y1="493" x2="330" y2="507"/>
    <line x1="470" y1="493" x2="470" y2="507"/>
  </g>
  <text x="400" y="496" text-anchor="middle" font-size="12" fill="#121212" font-weight="600">300 mm</text>
  <text x="400" y="530" text-anchor="middle" font-size="11" fill="#555">a foot, a tread, a tile</text>
</svg>
