<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Roboto, Helvetica, Arial, sans-serif">
  <!-- Field Method: pace calibration on a 20 m baseline -->

  <!-- Ground line -->
  <line x1="60" y1="150" x2="700" y2="150" stroke="#121212" stroke-width="2"/>

  <!-- metre ticks (20 x 1 m), 640px / 20 = 32px each -->
  <g stroke="#555" stroke-width="1">
    <line x1="60" y1="150" x2="60" y2="160"/>
    <line x1="700" y1="150" x2="700" y2="160"/>
  </g>
  <g stroke="#CCC" stroke-width="1">
    <line x1="92" y1="150" x2="92" y2="156"/>
    <line x1="124" y1="150" x2="124" y2="156"/>
    <line x1="156" y1="150" x2="156" y2="156"/>
    <line x1="188" y1="150" x2="188" y2="156"/>
    <line x1="220" y1="150" x2="220" y2="156"/>
    <line x1="252" y1="150" x2="252" y2="156"/>
    <line x1="284" y1="150" x2="284" y2="156"/>
    <line x1="316" y1="150" x2="316" y2="156"/>
    <line x1="348" y1="150" x2="348" y2="156"/>
    <line x1="380" y1="150" x2="380" y2="156"/>
    <line x1="412" y1="150" x2="412" y2="156"/>
    <line x1="444" y1="150" x2="444" y2="156"/>
    <line x1="476" y1="150" x2="476" y2="156"/>
    <line x1="508" y1="150" x2="508" y2="156"/>
    <line x1="540" y1="150" x2="540" y2="156"/>
    <line x1="572" y1="150" x2="572" y2="156"/>
    <line x1="604" y1="150" x2="604" y2="156"/>
    <line x1="636" y1="150" x2="636" y2="156"/>
    <line x1="668" y1="150" x2="668" y2="156"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="60" y="176" text-anchor="middle">0</text>
    <text x="380" y="176" text-anchor="middle">10 m</text>
    <text x="700" y="176" text-anchor="middle">20 m</text>
  </g>

  <!-- walking figure at start -->
  <g fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round">
    <circle cx="90" cy="120" r="9" fill="#FAFAFA"/>
    <line x1="90" y1="129" x2="90" y2="140"/>
    <line x1="90" y1="133" x2="80" y2="145"/>
    <line x1="90" y1="133" x2="100" y2="145"/>
  </g>

  <!-- step arcs -->
  <g fill="none" stroke="#9B1B1B" stroke-width="1.5">
    <path d="M100 150 A 16 16 0 0 1 132 150"/>
    <path d="M132 150 A 16 16 0 0 1 164 150"/>
    <path d="M164 150 A 16 16 0 0 1 196 150"/>
    <path d="M196 150 A 16 16 0 0 1 228 150"/>
  </g>

  <!-- guess -> measure -> error loop -->
  <g font-size="12">
    <rect x="300" y="210" width="120" height="40" rx="4" fill="none" stroke="#555" stroke-width="1.5"/>
    <text x="360" y="234" text-anchor="middle" fill="#555" font-weight="600">GUESS</text>
    <line x1="420" y1="230" x2="470" y2="230" stroke="#9B1B1B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="470" y="210" width="130" height="40" rx="4" fill="none" stroke="#9B1B1B" stroke-width="1.5"/>
    <text x="535" y="234" text-anchor="middle" fill="#9B1B1B" font-weight="700">MEASURE</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#9B1B1B"/>
    </marker>
  </defs>
  <text x="480" y="280" text-anchor="middle" font-size="11" fill="#555" font-style="italic">the gap between guess and measure is the learning</text>
</svg>
