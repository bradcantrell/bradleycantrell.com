<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
<title>TORCELLO — SOIL AND SUBSTRATE SECTION</title>
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0f1620"/><stop offset="100%" stop-color="#05080c"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="850" fill="url(#bg)"/>
<text x="800.0" y="34" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="300" letter-spacing="8">TORCELLO — SOIL AND SUBSTRATE SECTION</text>
<text x="800.0" y="52" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="Helvetica,Arial,sans-serif" font-size="8" letter-spacing="3">FROM CATHEDRAL FOUNDATIONS TO THE CARANTO PALEOSOL — WHAT TORCELLO IS BUILT ON</text>
<path d="M 80,200 Q 360.0,180 640,200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/><text x="90" y="194" fill="rgba(255,255,255,0.3)" font-family="Helvetica,Arial,sans-serif" font-size="7">GROUND SURFACE</text><rect x="80" y="200" width="560" height="40" fill="#3a3020" opacity="0.4" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/><text x="90" y="216.0" fill="rgba(255,255,255,0.45)" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="600">Anthropic fill</text><text x="90" y="230.0" fill="rgba(255,255,255,0.25)" font-family="Helvetica,Arial,sans-serif" font-size="7" font-style="italic">Medieval construction debris</text><rect x="80" y="240" width="560" height="35" fill="#4a3a28" opacity="0.4" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/><text x="90" y="253.5" fill="rgba(255,255,255,0.45)" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="600">Lagoon sediment</text><text x="90" y="267.5" fill="rgba(255,255,255,0.25)" font-family="Helvetica,Arial,sans-serif" font-size="7" font-style="italic">Post-Roman accretion</text><rect x="80" y="275" width="560" height="25" fill="#5a4a30" opacity="0.4" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/><text x="90" y="283.5" fill="rgba(255,255,255,0.45)" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="600">Roman cultural layer</text><text x="90" y="297.5" fill="rgba(255,255,255,0.25)" font-family="Helvetica,Arial,sans-serif" font-size="7" font-style="italic">2nd c. BCE – 5th c. CE</text><rect x="80" y="300" width="560" height="80" fill="#6a5030" opacity="0.4" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/><text x="90" y="336.0" fill="rgba(255,255,255,0.45)" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="600">Caranto paleosol</text><text x="90" y="350.0" fill="rgba(255,255,255,0.25)" font-family="Helvetica,Arial,sans-serif" font-size="7" font-style="italic">Pleistocene compacted clay — IMPERMEABLE</text><rect x="80" y="380" width="560" height="200" fill="#3a4050" opacity="0.4" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/><text x="90" y="476.0" fill="rgba(255,255,255,0.45)" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="600">Marine sand and silt</text><text x="90" y="490.0" fill="rgba(255,255,255,0.25)" font-family="Helvetica,Arial,sans-serif" font-size="7" font-style="italic">Pliocene–Pleistocene</text><line x1="45" y1="200" x2="65" y2="200" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><text x="40" y="203" text-anchor="end" fill="rgba(255,255,255,0.2)" font-family="Helvetica,Arial,sans-serif" font-size="7">0m</text><line x1="45" y1="300" x2="65" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><text x="40" y="303" text-anchor="end" fill="rgba(255,255,255,0.2)" font-family="Helvetica,Arial,sans-serif" font-size="7">1m</text><line x1="45" y1="380" x2="65" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><text x="40" y="383" text-anchor="end" fill="rgba(255,255,255,0.2)" font-family="Helvetica,Arial,sans-serif" font-size="7">2m</text><line x1="45" y1="580" x2="65" y2="580" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><text x="40" y="583" text-anchor="end" fill="rgba(255,255,255,0.2)" font-family="Helvetica,Arial,sans-serif" font-size="7">4m</text><line x1="55" y1="200" x2="55" y2="580" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/><line x1="300" y1="200" x2="300" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="300" y1="295" x2="300" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><line x1="312" y1="200" x2="312" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="312" y1="295" x2="312" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><line x1="324" y1="200" x2="324" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="324" y1="295" x2="324" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><line x1="336" y1="200" x2="336" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="336" y1="295" x2="336" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><line x1="348" y1="200" x2="348" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="348" y1="295" x2="348" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><line x1="360" y1="200" x2="360" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="360" y1="295" x2="360" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><line x1="372" y1="200" x2="372" y2="295" stroke="rgba(60,40,20,0.5)" stroke-width="2"/><line x1="372" y1="295" x2="372" y2="305" stroke="rgba(60,40,20,0.3)" stroke-width="1"/><text x="336" y="318" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="Helvetica,Arial,sans-serif" font-size="6">Oak pile foundations (palafitte)</text><path d="M 110,260 Q 360.0,235 610,260" fill="none" stroke="rgba(126,200,248,0.5)" stroke-width="1.2" stroke-dasharray="6,4"/><text x="620" y="227" fill="rgba(126,200,248,0.5)" font-family="Helvetica,Arial,sans-serif" font-size="7" font-style="italic">freshwater lens (Ghyben-Herzberg)</text><line x1="100" y1="245" x2="620" y2="245" stroke="rgba(126,200,248,0.15)" stroke-width="0.8" stroke-dasharray="3,3"/><text x="630" y="241" fill="rgba(126,200,248,0.25)" font-family="Helvetica,Arial,sans-serif" font-size="6">water table</text><text x="680" y="90" fill="rgba(255,255,255,0.6)" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="3">FOUNDATIONS</text><line x1="680" y1="94" x2="1560" y2="94" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/><text x="680" y="110" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">Cathedral built on timber piles driven</text><text x="680" y="124" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">through lagoon sediment into the</text><text x="680" y="138" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">caranto paleosol. The caranto — a</text><text x="680" y="152" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">compacted Pleistocene clay — provides</text><text x="680" y="166" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">the load-bearing substrate beneath</text><text x="680" y="180" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">all lagoon construction.</text><text x="680" y="224" fill="rgba(255,255,255,0.6)" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="3">WATER TABLE</text><line x1="680" y1="228" x2="1560" y2="228" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/><text x="680" y="244" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">Freshwater lens floats above saline</text><text x="680" y="258" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">groundwater, perched on the caranto.</text><text x="680" y="272" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">Recharged by rainfall. Wells</text><text x="680" y="286" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">(vere da pozzo) collected water</text><text x="680" y="300" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">from this lens. Depth: ~0.5–1.5m.</text><text x="680" y="344" fill="rgba(255,255,255,0.6)" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="3">ARCHAEOLOGY</text><line x1="680" y1="348" x2="1560" y2="348" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/><text x="680" y="364" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">Roman and medieval cultural layers</text><text x="680" y="378" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">contain building debris, pottery, coins,</text><text x="680" y="392" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">and organic remains. Documenting</text><text x="680" y="406" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">occupation from 2nd c. CE to present.</text><text x="680" y="450" fill="rgba(255,255,255,0.6)" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="3">SUBSIDENCE</text><line x1="680" y1="454" x2="1560" y2="454" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/><text x="680" y="470" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">Groundwater extraction and sediment</text><text x="680" y="484" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">compaction cause ongoing subsidence.</text><text x="680" y="498" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">Relative sea level rise at Torcello:</text><text x="680" y="512" fill="rgba(255,255,255,0.35)" font-family="Helvetica,Arial,sans-serif" font-size="8">~3–5mm per year.</text><text x="800.0" y="740" text-anchor="middle" fill="rgba(255,255,255,0.10)" font-family="Helvetica,Arial,sans-serif" font-size="8" letter-spacing="3">STRATIGRAPHY BASED ON MOZZI ET AL. (2015) + CNR-ISMAR BOREHOLE DATA</text></svg>
