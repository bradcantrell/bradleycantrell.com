<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Systems — Map Template (Knoxville)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;background:#02070e;font-family:ui-monospace,Menlo,monospace;color:#cceeff}
  #map{position:absolute;inset:0}
  #panel{
    position:absolute;top:12px;right:12px;z-index:1000;max-width:280px;
    background:rgba(2,7,14,0.85);border:1px solid rgba(102,204,255,0.3);border-radius:6px;
    padding:10px 12px;font-size:12px;line-height:1.5;backdrop-filter:blur(6px)
  }
  #panel h1{font-size:12px;margin:0 0 6px;color:#66ccff;text-transform:uppercase;letter-spacing:.1em}
  #panel .kv{color:#5f7d99}
  #panel .kv b{color:#cceeff;font-weight:500}
  #panel .warn{color:#ffb000}
  .legend{position:absolute;bottom:20px;left:12px;z-index:1000;font-size:11px;color:#5f7d99;background:rgba(2,7,14,0.8);padding:8px 10px;border:1px solid rgba(102,204,255,0.2);border-radius:6px}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Living Systems · live read</h1>
  <div id="status" class="warn">fetching…</div>
</div>
<div class="legend">
  <span class="dot" style="background:#66ccff"></span> gauge &nbsp;
  <span class="dot" style="background:#00e5a0"></span> species
</div>
<script>
// ============================================================
// SITE — change these for your parcel
// ============================================================
const SITE = { name: "Tennessee River at Knoxville", lat: 35.9458, lng: -83.9467, zoom: 12 };
// NWPS live gauge (Tennessee River at Knoxville) — stage + flow + forecast + flood stages.
// NOTE: the downtown creeks (Third Creek, First Creek) are UNGAUGED — for those, drive the
// assessment with a design storm (Atlas 14 rainfall → runoff → inundation), not a live gauge.
const NWPS_GAUGE = "knot1";
const INAT_RADIUS_KM = 25;   // iNaturalist search radius

const map = L.map("map").setView([SITE.lat, SITE.lng], SITE.zoom);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: "abcd", maxZoom: 19
}).addTo(map);
const status = document.getElementById("status");

function say(k, v){ status.innerHTML += `<div class="kv">${k} <b>${v}</b></div>`; }

// --- NWPS river stage + flow (real-time + forecast) -----------
fetch(`https://api.water.noaa.gov/nwps/v1/gauges/${NWPS_GAUGE}`)
  .then(r => r.json())
  .then(d => {
    const obs = d.status.observed;
    const fc = d.status.forecast;
    const cat = (d.flood && d.flood.categories) || {};
    say("gauge", d.name);
    say("stage", `${obs.primary} ${obs.primaryUnit} · ${obs.floodCategory.replace(/_/g, ' ')}`);
    say("flow", `${obs.secondary} ${obs.secondaryUnit}`);
    say("forecast", `${fc.primary} ${fc.primaryUnit} by ${(fc.validTime || '').slice(0, 16)}`);
    say("flood stages", `action ${cat.action && cat.action.stage} · minor ${cat.minor && cat.minor.stage} · major ${cat.major && cat.major.stage} ft`);
    L.circleMarker([d.latitude, d.longitude], { radius: 7, color: "#66ccff", fillColor: "#66ccff", fillOpacity: 0.8 })
      .addTo(map).bindPopup(`<b>${d.name}</b><br>stage ${obs.primary} ${obs.primaryUnit}<br>flow ${obs.secondary} ${obs.secondaryUnit}`);
  }).catch(e => say("gauge", "unavailable — open water.noaa.gov and read the stage by hand"));

// --- Open-Meteo current weather ------------------------------
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SITE.lat}&longitude=${SITE.lng}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
  .then(r => r.json())
  .then(d => {
    const c = d.current;
    say("temp", `${c.temperature_2m}°F`);
    say("humidity", `${c.relative_humidity_2m}%`);
    say("wind", `${c.wind_speed_10m} mph`);
  }).catch(() => say("weather", "error"));

// --- Open-Meteo air quality (keyless) ------------------------
fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${SITE.lat}&longitude=${SITE.lng}&current=pm2_5,ozone,nitrogen_dioxide,us_aqi`)
  .then(r => r.json())
  .then(d => {
    const c = d.current;
    say("PM2.5", `${c.pm2_5} µg/m³`);
    say("ozone", `${c.ozone} µg/m³`);
    say("US AQI", `${c.us_aqi}`);
  }).catch(() => say("air quality", "error"));

// --- iNaturalist recent species observations ------------------
fetch(`https://api.inaturalist.org/v1/observations?lat=${SITE.lat}&lng=${SITE.lng}&radius=${INAT_RADIUS_KM}&per_page=40&order=desc&order_by=observed_on`)
  .then(r => r.json())
  .then(d => {
    let n = 0;
    (d.results || []).forEach(o => {
      if (!o.geojson || !o.geojson.coordinates) return;
      const [lng, lat] = o.geojson.coordinates;
      const taxon = o.taxon && o.taxon.preferred_common_name || o.taxon && o.taxon.name || "unknown";
      L.circleMarker([lat, lng], { radius: 3, color: "#00e5a0", fillColor: "#00e5a0", fillOpacity: 0.7 })
        .addTo(map).bindPopup(`<b>${taxon}</b><br>${o.observed_on || ""}`);
      n++;
    });
    say("species obs", `${n}`);
  }).catch(() => say("species", "error"));

// ============================================================
// TODO for your site:
//  - change SITE + USGS_SITE + radii
//  - add NWS alerts (api.weather.gov) as polygons
//  - add a static baseline layer (land cover / elevation) if wanted
//  - want station-level air quality markers? OpenAQ has them but
//    needs a free API key (openaq.org) — see skill.md
// ============================================================
</script>
</body>
</html>
